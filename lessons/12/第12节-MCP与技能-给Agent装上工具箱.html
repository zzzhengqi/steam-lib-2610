<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第 12 节 · MCP 与技能：给 Agent 装上工具箱</title>
<style>
:root{
  --bg:#ececef;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#8e8e93;--line:rgba(0,0,0,.08);
  --accent:#f26b1d;--accent2:#0a84ff;--ok:#1f9d55;--warn:#c27c0e;--danger:#ff3b30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#fbfbfc 0%,#eeeef1 48%,#dcdde2 100%);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:grid;place-items:center}
button{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}

/* ============ 课程舞台框架（与第 10 / 11 课统一） ============ */
.lesson{width:min(1320px,96vw);height:min(850px,94dvh);position:relative;border-radius:32px;background:#161618;padding:8px;box-shadow:0 0 0 4px #bfc0c5,0 30px 80px #3334;overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:25px;background:#e9e3da;isolation:isolate;border:6px solid #060708}
.wall{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#a9bed3 0%,#c8d5e2 26%,#ebe0d4 55%,#e7cdb2 78%,#d9b48f 100%)}
.wall i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
.wall i:nth-child(1){width:85%;height:65%;left:-15%;top:62%;background:radial-gradient(ellipse at 50% 0%,#e8c7a3 0%,#d7a97e 45%,transparent 70%)}
.wall i:nth-child(2){width:80%;height:58%;left:36%;top:70%;background:radial-gradient(ellipse at 50% 0%,#f0d6ba 0%,#dcb48c 45%,transparent 70%);animation-duration:27s}
.wall i:nth-child(3){width:46%;height:60%;left:56%;top:-18%;background:radial-gradient(circle,rgba(255,250,240,.9),rgba(255,235,210,.35) 40%,transparent 66%);animation-duration:30s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-3%) scale(1.06)}100%{transform:translate(-3%,2%) scale(.97)}}

.launcher{position:relative;z-index:2;width:min(100%,1200px);height:100%;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;justify-items:stretch;column-gap:clamp(26px,6vw,90px);padding:clamp(18px,4vw,72px)}
.wg{position:relative;overflow:hidden;border-radius:28px;border:0;color:var(--ink);
  background:linear-gradient(145deg,rgba(232,242,252,.84),rgba(255,248,238,.68));
  backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  box-shadow:0 10px 30px rgba(90,70,50,.12),inset 0 1px 0 rgba(255,255,255,.75);
  padding:clamp(24px,3vw,46px)}
.wg .wh{color:#b74609;font-size:14px;letter-spacing:.1em;font-weight:700}
.wg .chapter{margin:24px 0 10px;font-weight:600;color:var(--ink2);font-size:16px}
.launcher h1{font-size:clamp(32px,4.6vw,60px);margin:0;line-height:1.12;letter-spacing:-.035em}
.course-summary{margin:18px 0 0;color:#555;line-height:1.65;font-size:16px}
.course-path{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.course-path span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#ffffffa6;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.5vw,38px) clamp(10px,1.5vw,22px);text-align:center;align-items:start}
.ico{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.65em;cursor:pointer;color:var(--ink);font-size:clamp(11px,1.4vw,18px);perspective:22em}
.sq{position:relative;width:4.7em;height:4.7em;border-radius:22.5%;display:grid;place-items:center;
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 .35em .9em -.35em rgba(60,40,20,.35);
  transition:transform .4s var(--spring),box-shadow .3s,filter .2s}
.sq svg{width:50%;height:50%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico:hover .sq{transform:translateY(-.28em) scale(1.08);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1em 1.6em -.6em rgba(60,40,20,.5)}
.ico:active .sq{transform:scale(.92);filter:brightness(.92)}
.lb{font-size:.82em;font-weight:600;color:#1d1d1f;text-shadow:0 0 6px rgba(255,255,255,.7);transition:transform .35s var(--spring)}
.ico:hover .lb{transform:translateY(-.12em)}

/* ============ 弹窗与通用组件 ============ */
dialog.modal-overlay{--glass-strong:rgba(255,255,255,.96);--text:#1d1d1f;--sub:#515154;--orange:#b64b0a;--btn:#ff8c00;
  color:var(--text);position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:24px;
  background:rgba(25,25,28,.36);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;z-index:100}
dialog.modal-overlay:not([open]){display:none}
dialog.modal-overlay::backdrop{background:transparent}
.modal-card{width:min(960px,94vw);max-height:88vh;background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:32px;box-shadow:0 32px 64px rgba(0,0,0,.22);padding:34px 40px;overflow-y:auto;overflow-x:hidden;animation:cardPop .28s var(--ease)}
@keyframes cardPop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal-card :is(h2,h3,p,ul,pre){margin:0}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(0,0,0,.07)}
.modal-title-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.modal-badge{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,140,0,.14);color:var(--orange);white-space:nowrap}
.modal-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.close-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.06);font-size:18px;cursor:pointer;transition:.2s}
.close-btn:hover{background:rgba(0,0,0,.13)}
.lead-box{background:#f5f5f7;border-left:4px solid var(--btn);padding:14px 18px;border-radius:12px;font-size:15.5px;font-weight:600;margin-bottom:18px;line-height:1.55}
.lead-box code,.sub-card code,.q-text code,.term-hint code{font-family:var(--mono);background:rgba(255,140,0,.12);color:#b64b0a;padding:1px 6px;border-radius:6px;font-size:.92em}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:20px;padding:18px 20px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.sub-card.highlight{border:2px solid var(--btn);background:linear-gradient(#fffaf3,#fff)}
.sub-card h3{font-size:16.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sub-card p,.sub-card li{font-size:14px;color:var(--sub);line-height:1.6}
.sub-card ul{padding-left:18px;margin-top:6px}

.demo-btn{background:var(--btn);color:#fff;border:0;padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(255,140,0,.24);transition:.2s}
.demo-btn:hover{filter:brightness(.94);transform:translateY(-1px)}
.demo-btn.ghost{background:#e5e5ea;color:#1d1d1f;box-shadow:none}
.demo-btn.safe{background:#34c759;box-shadow:0 4px 12px rgba(52,199,89,.24)}
.demo-btn.danger{background:#ff3b30;box-shadow:0 4px 12px rgba(255,59,48,.22)}
.demo-btn.blue{background:#0a84ff;box-shadow:0 4px 12px rgba(10,132,255,.22)}
.demo-btn.purple{background:#5856d6;box-shadow:0 4px 12px rgba(88,86,214,.22)}
.demo-btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.mode-pill{padding:7px 14px;border-radius:999px;border:1.5px solid rgba(0,0,0,.1);background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s}
.mode-pill.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}

/* 模块 1：三兄弟分拣台 */
.trio-pill{background:#f5f5f7;border-radius:16px;padding:14px 16px;border-top:3px solid var(--btn)}
.trio-pill.blue{border-top-color:#0a84ff}
.trio-pill.purple{border-top-color:#5856d6}
.trio-pill b{display:block;font-size:15px;margin-bottom:4px}
.trio-pill span{font-size:13px;color:var(--sub);line-height:1.5;display:block}
.score-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f5f7;padding:11px 16px;border-radius:14px;margin-bottom:12px;font-size:13.5px;font-weight:700;flex-wrap:wrap}
.q-list{display:flex;flex-direction:column;gap:9px}
.q-item{background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:15px;padding:12px 15px;transition:.2s}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-text{font-size:14.2px;font-weight:600;line-height:1.5;flex:1}
.q-btns{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.q-fb{margin-top:8px;padding:8px 12px;border-radius:9px;font-size:13px;line-height:1.5;display:none}
.q-item.right{border-color:#34c759;background:#f4fdf6}
.q-item.right .q-fb{display:block;background:rgba(52,199,89,.12);color:#146c32}
.q-item.wrong{border-color:#ff3b30;background:#fff6f6}
.q-item.wrong .q-fb{display:block;background:rgba(255,59,48,.1);color:#b91c1c}

/* 模块 2：Skill 工坊 */
.tree-box{background:#1c1c1e;color:#e5e5ea;border-radius:16px;padding:15px 18px;font-family:var(--mono);font-size:13px;line-height:1.8}
.tree-hi{display:inline-block;background:rgba(255,140,0,.22);color:#ffb347;padding:1px 7px;border-radius:6px;font-weight:700;border:1px solid rgba(255,140,0,.45)}
.tpl-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.code-pre{background:#1c1c1e;color:#f2f2f7;border-radius:16px;padding:15px 18px;font-family:var(--mono);font-size:12.8px;line-height:1.68;white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)}
.run-box{margin-top:12px;background:#f0fdf4;border:1.5px solid #34c759;border-radius:14px;padding:13px 16px;font-size:13.8px;line-height:1.6;color:#14532d;display:none}
.run-box.show{display:block}

/* 模块 3：MCP 终端沙盘 */
.mcp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mcp-step-btn{padding:10px 10px;border-radius:12px;border:1.5px solid rgba(0,0,0,.1);background:#fff;text-align:left;cursor:pointer;transition:.2s}
.mcp-step-btn b{display:block;font-size:13px;margin-bottom:2px}
.mcp-step-btn span{display:block;font-size:11.5px;color:var(--sub)}
.mcp-step-btn.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.mcp-step-btn.on span{color:#aeaeb2}
.term-win{background:#161618;color:#f2f2f7;border-radius:18px;overflow:hidden;border:1px solid rgba(0,0,0,.15)}
.term-head{background:#252528;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:#aeaeb2}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.term-body{padding:16px 18px;font-family:var(--mono);font-size:13.2px;line-height:1.72;min-height:190px;white-space:pre-wrap}
.t-cmd{color:#64d2ff;font-weight:700}
.t-ok{color:#63e685}
.t-warn{color:#ffd60a}
.term-hint{margin-top:12px;background:#f5f5f7;border-radius:12px;padding:12px 15px;font-size:13.8px;color:var(--sub);line-height:1.55}

/* 模块 4：安全安检门 */
.safe-card{background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.2s}
.safe-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.safe-title{font-size:15px;font-weight:700;margin-bottom:4px}
.safe-desc{font-size:13.5px;color:var(--sub);line-height:1.55}
.safe-fb{margin-top:9px;padding:9px 12px;border-radius:10px;font-size:13.2px;line-height:1.55;display:none}
.safe-card.right{border-color:#34c759;background:#f4fdf6}
.safe-card.right .safe-fb{display:block;background:rgba(52,199,89,.12);color:#146c32}
.safe-card.wrong{border-color:#ff3b30;background:#fff6f6}
.safe-card.wrong .safe-fb{display:block;background:rgba(255,59,48,.1);color:#b91c1c}

/* 模块 5：12 课完全体工作流总图 */
.flow-chain{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.flow-node{background:#f5f5f7;border-radius:16px;padding:14px 12px;border-top:3px solid var(--btn);position:relative}
.flow-node .tag-l{font-size:11px;font-weight:700;color:var(--orange);background:rgba(255,140,0,.12);padding:2px 7px;border-radius:999px;display:inline-block;margin-bottom:6px}
.flow-node strong{display:block;font-size:14.5px;margin-bottom:4px}
.flow-node span{font-size:12.5px;color:var(--sub);line-height:1.45;display:block}
.grad-banner{background:linear-gradient(135deg,#1d1d1f,#2c2c30);color:#fff;border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.grad-banner h3{font-size:18px;margin-bottom:4px;color:#ffb347}
.grad-banner p{font-size:14px;color:#d1d1d6;line-height:1.6}

/* 模块 6：练习与自检 */
.prompt-box{background:#f2f2f7;border:1px dashed #aeaeb2;border-radius:16px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.prompt-text{font-size:13.8px;font-weight:600;line-height:1.55;white-space:pre-line;user-select:text;flex:1}
.check-item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;margin-bottom:9px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;transition:.2s}
.check-item.checked{background:#f0fdf4;border-color:#34c759;color:#15803d}
.check-box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid #c7c7cc;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.check-item.checked .check-box{background:#34c759;border-color:#34c759;color:#fff}
.copy-field{position:fixed;opacity:0}

@media(max-width:820px){
  .launcher,.grid-3,.grid-2,.mcp-steps,.flow-chain{grid-template-columns:1fr}
  .launcher{gap:22px;overflow:auto}
  .modal-card{padding:22px 18px;border-radius:22px}
  .q-top,.safe-top,.prompt-box{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<main class="lesson">
  <div class="screen">
    <div class="wall"><i></i><i></i><i></i></div>
    <div class="launcher">
      <section class="wg course-widget">
        <div class="wh">STEAM · 蒸汽会员资源库</div>
        <div class="chapter">主修课 · 第 12 节（收官课）</div>
        <h1>MCP 与技能：<br>给 Agent 装上工具箱</h1>
        <p class="course-summary">分清规则、技能与外部接口，在 Codex 里跑通你的第一个 $Skill，并安全接通外部世界。</p>
        <div class="course-path">
          <span>三兄弟分拣</span>
          <span>SKILL.md 实战</span>
          <span>MCP 接入</span>
          <span>安全安检门</span>
          <span>12 课毕业总图</span>
        </div>
      </section>

      <section class="tiles" aria-label="本节课程模块">
        <button class="ico" type="button" onclick="openModal('trio')">
          <span class="sq" style="background:linear-gradient(145deg,#2b95ff,#0066e6)">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/></svg>
          </span>
          <span class="lb">三兄弟分拣台</span>
        </button>

        <button class="ico" type="button" onclick="openModal('skill')">
          <span class="sq" style="background:linear-gradient(145deg,#ff9f0a,#ff6b00)">
            <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </span>
          <span class="lb">打造 $Skill 绝活</span>
        </button>

        <button class="ico" type="button" onclick="openModal('mcp')">
          <span class="sq" style="background:linear-gradient(145deg,#56ccf2,#2f80ed)">
            <svg viewBox="0 0 24 24"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v4a6 6 0 0 1-12 0V8Z"/></svg>
          </span>
          <span class="lb">MCP 接入沙盘</span>
        </button>

        <button class="ico" type="button" onclick="openModal('safety')">
          <span class="sq" style="background:linear-gradient(145deg,#ff5e57,#d63031)">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
          <span class="lb">安全授权安检门</span>
        </button>

        <button class="ico" type="button" onclick="openModal('combo')">
          <span class="sq" style="background:linear-gradient(145deg,#7f7fd5,#5856d6)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          </span>
          <span class="lb">12 课完全体地图</span>
        </button>

        <button class="ico" type="button" onclick="openModal('practice')">
          <span class="sq" style="background:linear-gradient(145deg,#3a3a3c,#1c1c1e)">
            <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
          </span>
          <span class="lb">毕业练习与自检</span>
        </button>
      </section>
    </div>
  </div>
</main>

<dialog class="modal-overlay" id="modalOverlay" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalContent"></div>
</dialog>

<script>
const trioQuestions = [
  {
    id: 0,
    text: "本项目所有页面必须保持浅色圆角风格，严禁引入外部框架。",
    ans: "agents",
    reason: "属于每次开工都要守的“全店红线”，放进根目录 AGENTS.md。"
  },
  {
    id: 1,
    text: "让 Codex 直接读取我 Notion 测试空间里的《本周选题清单》。",
    ans: "mcp",
    reason: "需要把手伸出本地文件夹去连接外部软件，必须靠 MCP 转接头。"
  },
  {
    id: 2,
    text: "每次发布网页前，按 4 步固定清单检查手机排版、死链和错别字，并输出体检表。",
    ans: "skill",
    reason: "这是按需触发的多步专项 SOP，做成 SKILL.md，需要时用 $技能名 一键调用。"
  },
  {
    id: 3,
    text: "每次导出短视频前，自动核验画幅 1080×1920、字幕安全区和音频静音片段。",
    ans: "skill",
    reason: "属于可复用的专项工作流，收在 .agents/skills/ 抽屉里，平时不占上下文。"
  },
  {
    id: 4,
    text: "让 Codex 查一下云端数据库或在线文档里的最新一条客户反馈。",
    ans: "mcp",
    reason: "只要涉及读写外部平台或实时外部数据，找 MCP 就对了。"
  }
];

const skillTemplates = {
  web: {
    name: "check-before-ship",
    path: ".agents/skills/check-before-ship/SKILL.md",
    cmd: "$check-before-ship 检查当前 index.html",

function openModal(key) {
  const data = modalData[key];
  if (!data) return;
  content.innerHTML =

    data.badge + '</span><h2 class="modal-title" id="modalTitle">' + data.title +
    '</h2></div><button class="close-btn" type="button" onclick="closeModal()" aria-label="关闭">✕</button></div>' +
    data.html;
  if (key === 'trio') renderTrio();
  if (key === 'skill') switchSkill(activeSkill);
  if (key === 'mcp') renderMcp(activeMcp);
  if (key === 'safety') renderSafe();
  if (!overlay.open) overlay.showModal();
  content.scrollTop = 0;
  content.querySelector('.close-btn').focus();
}

function closeModal() {
  overlay.close();
}

/* 模块 1：三兄弟分拣 */
function renderTrio() {
  const list = document.getElementById('trioList');
  if (!list) return;
  let done = 0, right = 0;
  list.innerHTML = trioQuestions.map(q => {
    const pick = trioState[q.id];
    let cls = 'q-item', fb = '';
    if (pick) {
      done++;
      const ok = pick === q.ans;
      if (ok) right++;
      cls += ok ? ' right' : ' wrong';
      fb = (ok ? '✅ 分拣正确！' : '❌ 选偏啦！') + q.reason;
    }
    return `
      <div class="${cls}">
        <div class="q-top">
          <div class="q-text">${q.id + 1}. ${q.text}</div>
          <div class="q-btns">
            <button type="button" class="demo-btn sm" onclick="pickTrio(${q.id},'agents')">AGENTS.md</button>
            <button type="button" class="demo-btn purple sm" onclick="pickTrio(${q.id},'skill')">Skill</button>
            <button type="button" class="demo-btn blue sm" onclick="pickTrio(${q.id},'mcp')">MCP</button>
          </div>
        </div>
        <div class="q-fb">${fb}</div>
      </div>
    `;
  }).join('');
  document.getElementById('trioProgress').textContent = '已分拣：' + done + ' / ' + trioQuestions.length + ' 题';
  const sc = document.getElementById('trioScore');
  if (done === trioQuestions.length) {
    sc.textContent = '🎉 全部分拣完成：答对 ' + right + ' / 5 题，三兄弟分工已彻底通透！';
    sc.style.color = '#15803d';
  } else if (done > 0) {
    sc.textContent = '当前答对：' + right + ' / ' + done + ' 题';
    sc.style.color = '#b64b0a';
  } else {
    sc.textContent = '点击每题右侧归类，看你是否彻底分清';
    sc.style.color = '#b64b0a';
  }
}
function pickTrio(id, val) { trioState[id] = val; renderTrio(); }
function resetTrio() { trioState = {}; renderTrio(); }

/* 模块 3：MCP 沙盘 */
function renderMcp(idx) {
  activeMcp = idx;
  const bar = document.getElementById('mcpStepBar');
  const body = document.getElementById('termBody');
  const hint = document.getElementById('termHint');
  if (!bar) return;
  bar.innerHTML = mcpSteps.map((s, i) => `
    <button type="button" class="mcp-step-btn ${i === idx ? 'on' : ''}" onclick="renderMcp(${i})">
      <b>${s.title}</b><span>${s.sub}</span>
    </button>
  `).join('');
  const cur = mcpSteps[idx];
  body.innerHTML = `<span class="t-cmd">${cur.cmd}</span>\n\n<span class="t-ok">${cur.out}</span>`;
  hint.innerHTML = '💡 <strong>讲师解说：</strong>' + cur.hint;
}
function copyMcpCmd() {
  const raw = mcpSteps[activeMcp].cmd.replace(/^\$\s*/, '').replace(/^你：/, '');
  copyRawText(raw, 'copyMcpBtn', '复制本步命令');
}

/* 模块 4：安全安检门 */
function renderSafe() {
  const box = document.getElementById('safeList');
  if (!box) return;
  box.innerHTML = safetyCases.map(c => {
    const pick = safeState[c.id];
    let cls = 'safe-card', fb = '';
    if (pick !== undefined) {
      const ok = (pick === 'allow') === c.allow;
      cls += ok ? ' right' : ' wrong';
      fb = (ok ? '✅ 安检把关准确！' : '🚨 危险！判断反了！') + c.reason;
    }
    return `
      <div class="${cls}">

        <div class="safe-fb">${fb}</div>
      </div>
    `;
  }).join('');
}
function pickSafe(id, val) { safeState[id] = val; renderSafe(); }

/* 通用辅助 */
function toggleCheck(btn) {
  btn.setAttribute('aria-pressed', btn.classList.toggle('checked'));
}
function copyById(elId, btnId, label) {
  const el = document.getElementById(elId);
  if (!el) return;
  copyRawText(el.textContent.trim(), btnId, label);
}
async function copyRawText(text, btnId, label) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch {
    const field = document.createElement('textarea');
    field.value = text;
    field.className = 'copy-field';
    content.append(field);
    field.select();
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
  }
  btn.textContent = copied ? '已复制 ✓' : '请手动复制';
  btn.style.background = copied ? '#34c759' : '#ff8c00';
  setTimeout(() => {
    if (btn.isConnected) {
      btn.textContent = label;
      btn.style.background = '';
    }
  }, 1800);
}

document.addEventListener('keydown', event => {
  if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[1-6]$/.test(event.key)) {
    openModal(keys[Number(event.key) - 1]);
  }
});
</script>
</body>
