<div class="bg"><div class="steam"><i></i><i></i><i></i><i></i><i></i></div></div>
<main class="stage"><div class="lesson"><div class="screen" id="home"><div class="wall"><i></i><i></i><i></i><i></i></div><div class="launcher"><div class="wg course-widget"><div class="wh">STEAM · 蒸汽会员资源库</div><p class="chapter">主修课 · 第 1 节</p><h1>认识 AI<br>对话式编程</h1><p class="course-summary">从一句需求，到一个能自己验收的结果。</p><div class="course-path"><span>看见结果</span><span>说清任务</span><span>自己检查</span></div></div><div class="tiles" id="tiles"></div></div></div>
</div></main>
<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalContent"></div></section>
</div>
<script>
const file=(img,alt,caption)=>`<figure><a href="assets/${img}" target="_blank" rel="noopener"><img src="assets/${img}" alt="${alt}"></a><figcaption>${caption} · 点击图片放大</figcaption></figure>`;
const card=(h,p,links='')=>`<article class="card"><h3>${h}</h3><p>${p}</p>${links?'<div class="links">'+links+'</div>':''}</article>`;
const icon=(label,mark,g1,g2,attr='',purpose='')=>`<button type="button" class="ico" ${attr}><span class="sq" style="--g1:${g1};--g2:${g2}">${mark}</span><span class="lb">${label}</span>${purpose?`<span class="tool-purpose">${purpose}</span>`:''}</button>`;
const marks={tools:     { s: "工具下载", g: ["#7d7bf2", "#5856d6"], p: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>' },
install:   { s: "Win 安装", g: ["#48484a", "#1c1c1e"], p: '<rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M6 9l3 3-3 3"/><path d="M12 15h6"/>' },
prompts:   { s: "提示词",   g: ["#5fd3e6", "#30b0c7"], p: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>' },
mac:       { s: "Mac 安装", g: ["#ffffff", "#f1f1f4", "#1d1d1f"], p: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M1 20h22"/>' },
projects:  { s: "源码案例", g: ["#45a6ff", "#007aff"], p: '<path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/>' },
safety:    { s: "安全守则", g: ["#5fdd7c", "#30b14f"], p: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>' }};
const apps=[['先看结果','projects',0],['什么是 Agent','prompts',1],['你和 Agent 怎么分工','tools',2],['第一次做什么','mac',3],['哪些要自己把关','safety',4],['课后小练习','install',5]];
const modalData={
result:{badge:"01 · 先看结果",title:"不会写一行代码，也能做出能用的软件",html:`<div class="lead-box">核心目标：能用一句话解释什么是 Agent，以及为什么零编程基础也能做出软件。</div><div class="sub-card"><div><h3>💬 试着给 Agent 发一句大白话需求：</h3><p>“帮我把桌面上的 50 张活动照片，按拍摄日期自动重命名并分类建好文件夹。”</p></div><button class="demo-btn" onclick="runFakeAgent()">▶ 点击模拟 Agent 执行</button><div class="terminal-box" id="agentConsole"><span style="color:#8e8e93">// 等待接收你的大白话指令...</span></div></div>`},
agent:{badge:"02 · 核心概念",title:"什么是 Agent？它和聊天机器人有什么区别？",html:`<div class="lead-box">一句话总结：聊天机器人只负责“出主意”，而 Agent 负责“进到你的工作区把活干完”。</div><div class="compare-grid"><div class="sub-card"><h3>🤖 普通聊天机器人</h3><p><strong>模式：你问一句，它答一句，然后停在原地等你。</strong></p><ul><li>只输出文字或代码片段</li><li>需要你自己新建文件、复制粘贴</li><li>运行报错后，你得手动把报错贴回去问它</li><li><strong>你像一个不停跑腿的搬运工</strong></li></ul></div><div class="sub-card highlight"><h3>⚡ AI Agent（智能体）</h3><p><strong>模式：接下目标后，自主闭环执行直到任务完成。</strong></p><ul><li>直接读取你文件夹里的真实文件</li><li>自己创建文件、写代码、运行命令</li><li>看到报错后自己分析、自己改代码重跑</li></ul><div class="flow-steps"><span class="step-chip">1. 读文件</span><span class="step-chip">2. 写代码</span><span class="step-chip">3. 跑命令</span><span class="step-chip">4. 自动修 Bug</span></div></div></div>`},
role:{badge:"03 · 角色分工",title:"你和 Agent 怎么分工？",html:`<div class="lead-box">你的核心价值在于判断“对不对、好不好”，而不是研究“代码怎么写”。</div><div class="compare-grid"><div class="sub-card highlight"><h3>🧑‍💼 你的角色：产品经理 + 验收员</h3><ul><li><strong>提需求</strong>：用大白话讲清楚你要做什么、给谁用</li><li><strong>定标准</strong>：告诉它界面好不好看、功能顺不顺手</li><li><strong>随时叫停</strong>：看不懂黑框日志？直接让它“用大白话再讲一遍”</li></ul></div><div class="sub-card"><h3>🛠️ Agent 的角色：全能工程师</h3><ul><li><strong>拆解方案</strong>：自动规划需要建几个文件、用什么技术</li><li><strong>编写与调试</strong>：包揽全部语法编写与报错修复</li><li><strong>充当助教</strong>：随时把每一步操作翻译成你能听懂的人话</li></ul></div></div>`},
first:{badge:"04 · 第一次做什么",title:"新手最适合用 Agent 做的 6 类事",html:`<div class="lead-box">从身边高频、看得见结果的小需求开始，10 分钟就能收获第一个成品。</div><div class="tag-grid"><div class="scene-item"><span class="emoji">🌐</span><strong>高颜值网页</strong><span>个人主页、活动宣传页、作品集展示</span></div><div class="scene-item"><span class="emoji">🧰</span><strong>效率小工具</strong><span>二维码生成器、倒计时器、格式转换器</span></div><div class="scene-item"><span class="emoji">✨</span><strong>交互动画</strong><span>教学演示动画、抽奖转盘、数据图表</span></div><div class="scene-item"><span class="emoji">📁</span><strong>批量处理文件</strong><span>几百个文件一键重命名、自动归类整理</span></div><div class="scene-item"><span class="emoji">📊</span><strong>数据整理</strong><span>多张 Excel 表格合并、自动清洗去重</span></div><div class="scene-item"><span class="emoji">📝</span><strong>自动生成文档</strong><span>周报汇总、会议纪要排版、批量生成合同</span></div></div>`},
safety:{badge:"05 · 哪些要自己把关",title:"划清安全红线：哪些不能直接交给它？",html:`<div class="lead-box">让 Agent 做你的效率武器和创意画板，但绝不让它替你承担高风险决策。</div><div class="compare-grid"><div class="sub-card safe"><h3>✅ 放心交给 Agent 放手做</h3><ul><li>本地文件夹整理、公开信息网页制作</li><li>日常办公文档排版、学习演示小工具</li><li>即便改错了也能随时回退的创意尝试</li></ul></div><div class="sub-card danger"><h3>🛑 必须自己把关的高风险红线</h3><ul><li><strong>涉及资金安全</strong>：自动转账、支付接口、实盘交易程序</li><li><strong>核心隐私合规</strong>：包含账号密码、客户敏感数据的上传与处理</li><li><strong>专业资质审核</strong>：医疗诊断、法律条文定稿、财务审计结论</li></ul></div></div>`},
practice:{badge:"06 · 课后小练习",title:"动手练习与第 1 课自检清单",html:`<div class="lead-box">哪怕还没装好本地环境，现在就可以复制下面这句话，发给你的 AI 试一试！</div><div class="prompt-box"><div class="prompt-text" id="promptText">“请用大白话告诉我，你能帮我做哪 5 类事？每类各举一个我能在 10 分钟内完成的例子。”</div><button class="demo-btn" id="copyBtn" onclick="copyPrompt()">复制提示词</button></div><h3 style="font-size:18px;margin-bottom:12px">📋 过关自检清单（点击打勾）：</h3><button class="check-item" onclick="toggleCheck(this)" aria-pressed="false"><span class="check-box">✓</span><span>我能用一句大白话，向身边的朋友解释什么是 Agent</span></button><button class="check-item" onclick="toggleCheck(this)" aria-pressed="false"><span class="check-box">✓</span><span>我知道自己在协作中的角色是“提需求 + 验收”</span></button>`}
};
const pages=Object.values(modalData);
const id=n=>document.getElementById(n);
const modal=id('modalOverlay');let current=0,trigger=null;
id('tiles').innerHTML=apps.map(([n,key,i])=>{const m=marks[key];return icon(n,'<svg viewBox="0 0 24 24" aria-hidden="true">'+m.p+'</svg>',m.g[0],m.g[1]+(m.g[2]?';--gc:'+m.g[2]:''),`data-page="${i}"`);}).join('');
function show(i){
  timers.forEach(clearTimeout);timers=[];
  current=(i+pages.length)%pages.length;
  const {badge,title,html}=pages[current];
  id('home').inert=true;
  modal.classList.add('active');
  modal.setAttribute('aria-hidden','false');
  id('modalContent').innerHTML=`<div class="modal-header"><div class="modal-title-wrap"><span class="modal-badge">${badge}</span><h2 class="modal-title" id="modalTitle">${title}</h2></div><button type="button" class="close-btn" aria-label="关闭">✕</button></div>`+html;
  modal.querySelector('.modal-card').scrollTop=0;
  requestAnimationFrame(()=>modal.querySelector('.close-btn').focus({preventScroll:true}));
}
function home(){
  timers.forEach(clearTimeout);timers=[];
  modal.classList.remove('active');
  id('home').inert=false;
  (trigger||id('tiles').querySelector('button')).focus();
  modal.setAttribute('aria-hidden','true');
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-page]');
  if(go){trigger=go;show(Number(go.dataset.page));}
  else if(e.target===modal||e.target.closest('.close-btn'))home();
});
let timers=[];
function runFakeAgent(){const box=document.getElementById('agentConsole');if(!box)return;timers.forEach(clearTimeout);timers=[];box.innerHTML='';['▶ 1. 正在读取桌面「活动照片」文件夹... 发现 50 张 JPG 文件','▶ 2. 自动编写整理脚本 rename_photos.py 并读取拍摄 EXIF 时间...','▶ 3. 遇到 2 张无拍摄时间截图 → 自动按文件修改日期兜底处理...','✅ 任务完成！已生成「2026-11-18」「2026-11-20」两个文件夹，全部重命名完毕。'].forEach((step,i)=>timers.push(setTimeout(()=>box.insertAdjacentHTML('beforeend',`<span class="terminal-line">${step}</span>`),i*650)))}
async function copyPrompt(){const text=document.getElementById('promptText').innerText.replace(/^“|”$/g,'');let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{}if(!ok){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();ok=document.execCommand('copy');area.remove()}const btn=document.getElementById('copyBtn');btn.textContent=ok?'已复制 ✓':'请手动复制';if(ok){setTimeout(()=>{if(btn.isConnected){btn.textContent='复制提示词'}},2000)}}
function toggleCheck(el){const checked=el.classList.toggle('checked');el.setAttribute('aria-pressed',String(checked))}
document.addEventListener('keydown',e=>{
  const open=modal.classList.contains('active');
  if(e.key==='Escape'&&open){home();return;}
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    if(!open)trigger=document.activeElement.closest('[data-page]');
    show(open?current+(e.key==='ArrowRight'?1:-1):0);
  }
});
