<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 2 节 · 蒸汽会员资源库</title>
<link rel="stylesheet" href="assets/library.css"><style>
[hidden]{display:none!important}.lesson{width:min(1320px,96vw);height:min(850px,94dvh);position:relative;border-radius:32px;background:#161618;padding:8px;box-shadow:0 0 0 4px #bfc0c5,0 30px 80px #3334;overflow:hidden}.lesson .screen{position:relative;height:100%;inset:auto;border-radius:25px}.lesson .wall{width:100%;left:0}.launcher{position:relative;height:100%;display:grid;align-content:center;justify-items:center;gap:30px;padding:24px}.launcher h1{font-size:clamp(30px,5vw,64px);margin:0;letter-spacing:-.04em}.launcher p{margin:0;color:#555}.launcher .ico,.tools .ico{opacity:1;font-size:19px}.tiles,.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;text-align:center}.tools{grid-template-columns:repeat(4,1fr);margin:30px 0}.tools .tool-purpose{font-size:14px;line-height:1.45;color:#57575c;text-align:center}.tools .sq img{max-width:66%;max-height:68%}.lesson .app{inset:8px;border-radius:25px}.lesson .app-body{padding-bottom:30px}.pane{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(240px,1fr);gap:24px;align-items:center}.pane figure{margin:0;min-width:0}.pane img{display:block;width:100%;max-height:52dvh;object-fit:contain;background:#f3f3f5;border-radius:14px}.pane figcaption{font-size:13px;margin-top:8px;color:var(--ink2)}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.subnav button[aria-current=true]{background:#0066cc;color:white}.lesson .card p,.lesson .card li{font-size:17px}.lesson footer{display:flex;gap:8px;justify-content:space-between;padding:9px 18px;border-top:1px solid var(--line);background:#fffd}.lesson button:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}.lesson .wrap{max-width:1160px}.lesson .card .links{margin-top:12px}
@media(max-width:720px){.lesson .app-body{padding:20px 15px}.pane{grid-template-columns:1fr}.tiles{gap:15px}.tools{grid-template-columns:repeat(2,1fr)}.launcher .ico,.tools .ico{font-size:12px}.lesson .app-title{margin-right:0}.lesson .app-head{padding-inline:10px}}
.launcher{width:min(100%,1200px);margin:auto;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;justify-items:stretch;column-gap:clamp(26px,6vw,90px);padding:clamp(18px,4vw,72px)}
.launcher .course-widget{opacity:1;cursor:default;transform:none;padding:clamp(22px,3vw,46px);background:linear-gradient(145deg,rgba(232,242,252,.84),rgba(255,248,238,.68))}
.launcher .course-widget .wh{color:#b74609;font-size:14px}
.launcher .course-widget .chapter{margin:24px 0 10px;font-weight:600;color:var(--ink2)}
.launcher h1{font-size:clamp(32px,5vw,70px);line-height:1.1;letter-spacing:-.035em}
.launcher .course-summary{margin:17px 0 0;line-height:1.65}
.course-path{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.course-path span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#ffffff94}
.launcher .tiles{gap:clamp(13px,2.5vw,38px) clamp(9px,1.5vw,20px);align-items:start}.launcher .ico{font-size:clamp(10px,1.5vw,20px);gap:.65em}
@media(max-width:720px){.launcher{grid-template-columns:1fr;gap:24px;overflow:auto}.launcher h1 br{display:none}.launcher .course-widget .chapter{margin:13px 0 7px}.launcher .course-summary{margin-top:9px}.course-path{margin-top:12px}.launcher .ico{font-size:clamp(12px,3.3vw,16px)}}
</style></head><body>
<div class="bg"><div class="steam"><i></i><i></i><i></i><i></i><i></i></div></div>
<main class="stage"><div class="lesson"><div class="screen" id="home"><div class="wall"><i></i><i></i><i></i><i></i></div><div class="launcher"><div class="wg course-widget"><div class="wh">STEAM · 蒸汽会员资源库</div><p class="chapter">主修课 · 第 2 节</p><h1>把 Codex<br>准备好</h1><p class="course-summary">安装桌面应用，登录，打开一个练习文件夹。</p><div class="course-path"><span>安装桌面应用</span><span>登录 Codex</span><span>检查练习文件夹</span></div></div><div class="tiles" id="tiles"></div></div></div>
<section class="app" id="lesson" hidden aria-labelledby="heading"><header class="app-head"><button class="app-back" id="back">‹ 主屏幕</button><div class="app-title" id="label"></div></header><div class="app-body" id="body"><div class="wrap" id="page"></div></div><footer><button class="btn" id="prev">‹ 上一步</button><span id="count"></span><button class="btn pri" id="next">下一步 ›</button></footer></section></div></main>
<script>
const ref='https://www.igeeksblog.com/how-to-use-chatgpt-on-mac/#how-to-get-the-chatgpt-app-for-mac';
const openai='https://learn.chatgpt.com/docs/quickstart';
const file=(img,alt,caption= 'Mac 实机参考 · iGeeksBlog（旧版）')=>`<figure><a href="assets/${img}" target="_blank" rel="noopener"><img src="assets/${img}" alt="${alt}"></a><figcaption><a href="${ref}" target="_blank" rel="noopener">${caption}</a> · 点击图片放大</figcaption></figure>`;
const link=(url,name)=>`<a class="btn" href="${url}" target="_blank" rel="noopener">${name} ↗</a>`;
const card=(h,p,links='')=>`<article class="card"><h3>${h}</h3><p>${p}</p>${links?'<div class="links">'+links+'</div>':''}</article>`;
const icon=(label,mark,g1,g2,attr='',purpose='')=>`<button type="button" class="ico" ${attr}><span class="sq" style="--g1:${g1};--g2:${g2}">${mark}</span><span class="lb">${label}</span>${purpose?`<span class="tool-purpose">${purpose}</span>`:''}</button>`;
const tools=[['Git','git.svg','改坏了，能回到之前保存的一版','https://git-scm.com/'],['Node.js','node.svg','有些网页要先启动，才能在浏览器里看','https://nodejs.org/'],['Python','python.svg','让电脑一次处理很多文件','https://www.python.org/'],['WSL','wsl.png','让 Windows 也能用 Linux 专用工具','https://learn.microsoft.com/windows/wsl/']];
const when=['第一次想给作品存档，或跟做 Git 发布教程时再装。','项目说明写着需要 Node.js，或让你先运行 npm 命令时再装。','拿到一个要用 Python 运行的 .py 文件时再装。只打开表格不用装。','你用 Windows，而且项目明确要求 WSL 或 Linux 环境时再装。Mac 不用装 WSL。'];
const marks={tools:     { s: "工具下载", g: ["#7d7bf2", "#5856d6"], p: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>' },
install:   { s: "Win 安装", g: ["#48484a", "#1c1c1e"], p: '<rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M6 9l3 3-3 3"/><path d="M12 15h6"/>' },
prompts:   { s: "提示词",   g: ["#5fd3e6", "#30b0c7"], p: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>' },
mac:       { s: "Mac 安装", g: ["#ffffff", "#f1f1f4", "#1d1d1f"], p: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M1 20h22"/>' },
projects:  { s: "源码案例", g: ["#45a6ff", "#007aff"], p: '<path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/>' },
safety:    { s: "安全守则", g: ["#5fdd7c", "#30b14f"], p: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>' }};
const apps=[['环境说明','tools',0],['Windows 安装','install',1],['登录 Codex','prompts',2],['Mac 安装','mac',3],['练习文件夹','projects',7],['开工检查','safety',8]];
const pages=[
['环境说明','这四个工具什么时候用？','现在只需安装 ChatGPT 桌面应用，用已有的账号和浏览器跟做。',`<div class="tools">${tools.map(([n,img,p,url],i)=>icon(n,`<img src="assets/${img}" alt="">`,'#fff','#f1f2f5',`data-tool="${i}"`,p)).join('')}</div><div id="tool-info">${card('这四个今天都不用装','下一节的待办网页保存成一个文件，双击就能在浏览器里打开。点图标，可以看什么时候再装。')}</div>`],
['Windows 安装','从官方入口安装','Windows：OpenAI 安装指南 → Microsoft Store → 安装。',card('打开 ChatGPT 桌面应用','第一次安装时，在商店点「获取」或「安装」；装好以后，从商店或 Windows 开始菜单打开应用。',link('https://learn.chatgpt.com/docs/windows/windows-app','Windows 官方安装指南'))],
['登录 Codex','登录 ChatGPT，再进入 Codex','用自己的 ChatGPT 账号登录；回到桌面应用后，在切换入口选择 Codex。',`<div class="pane">${file('login.jpg','Mac 旧版 ChatGPT 登录窗口，可见 Log in','登录窗口实图 · iGeeksBlog（Mac 旧版）')}${card('看到 Log in / 登录，就从这里开始','左图是 Mac 旧版登录窗口。当前登录选项和排列可能不同；登录完成后，请在桌面应用里进入 Codex。',link('https://auth.openai.com/log-in','OpenAI 官方登录页')+link(openai,'OpenAI 官方 Codex 切换演示'))}</div>`],
['Mac 安装','01｜下载并打开安装文件','先到苹果菜单 → 关于本机，确认 macOS 版本和芯片。',`<div class="pane">${file('mac-dmg.jpg','Mac 实机中打开已下载的 ChatGPT DMG 文件')}${card('从 Finder 找到下载文件','从官网下载 Mac 版。下载后打开 Finder → 下载，双击下载的安装文件。系统和芯片兼容性以官方说明为准。',link('https://chatgpt.com/download/','ChatGPT 官方下载')+link('https://help.openai.com/en/articles/9275200-downloading-the-chatgpt-macos-app','Mac 系统要求'))}</div>`],
['Mac 安装','02｜按窗口提示安装','打开安装文件后，看窗口里要求做什么。',`<div class="pane">${file('mac-drag.jpg','旧版安装窗口：把左侧 ChatGPT 图标拖到右侧 Applications 文件夹')}${card('如果看到 Applications 图标','像图中这样，把左边的 ChatGPT 拖进右边的 Applications（应用程序）。如果看到「Install ChatGPT」安装程序，则打开它并按屏幕指示完成。',link('https://support.apple.com/guide/mac-help/download-apps-mchlgtd_apps01/mac','Apple 安装说明'))}</div>`],
['Mac 安装','03｜从「应用程序」打开','Finder → 应用程序 → ChatGPT。',`<div class="pane">${file('mac-open.jpg','Mac Finder 应用程序目录中的 ChatGPT 应用图标')}${card('双击 ChatGPT','从「应用程序」启动。登录自己的 ChatGPT 账号，接着在桌面应用里选择 Codex。',link(openai,'OpenAI 快速上手'))}</div>`],
['Mac 安装','04｜登录并进入 Codex','登录成功后，回到桌面应用。',`<div class="pane">${file('login.jpg','Mac 旧版 ChatGPT 登录窗口')}${card('进入 Codex 后，打开自己的练习目录','先在 Finder 创建一个空文件夹，再从桌面应用中选择它。找不到 Codex 时，可以对照官方演示中的产品切换入口。',link('https://auth.openai.com/log-in','OpenAI 官方登录页')+link(openai,'OpenAI 官方 Codex 切换演示'))}</div>`],
['练习文件夹','给 Codex 一个练习文件夹','Windows 用文件资源管理器，Mac 用 Finder。',card('01 · 新建「Agent练习」','先建一个空文件夹，记住放在哪里。')+card('02 · 在 Codex 里打开它','从 Codex 的项目入口选择这个目录，确认当前会话对应的是你刚建的文件夹。')],
['开工检查','能读到练习目录，就准备好了','把这句话发给 Codex，再和自己的文件夹对一下。',`<div class="codebox"><pre class="code">请只检查当前工作文件夹，告诉我里面有几个文件。不要创建或修改任何文件。</pre></div>`+card('下一节：跑通第一个 Agent 任务','空文件夹通常应返回 0。如果结果不符，先检查选中的目录。准备好后，就用这个文件夹跟做第一个待办网页。')]
];
const id=n=>document.getElementById(n);
const modal=id('lesson');let current=0,trigger=null;
id('tiles').innerHTML=apps.map(([n,key,i])=>{const m=marks[key];return icon(n,'<svg viewBox="0 0 24 24" aria-hidden="true">'+m.p+'</svg>',m.g[0],m.g[1]+(m.g[2]?';--gc:'+m.g[2]:''),`data-page="${i}"`);}).join('');
function show(i){current=(i+pages.length)%pages.length;const [group,title,intro,content]=pages[current];modal.hidden=false;id('home').inert=true;document.body.classList.add('app-open');modal.classList.add('show');id('label').textContent=group;id('page').innerHTML=`<h2 id="heading">${title}</h2><p class="intro">${intro}</p>`+(group==='Mac 安装'?'<nav class="subnav" aria-label="Mac 安装步骤">'+['下载','安装','打开','登录'].map((n,i)=>`<button type="button" class="btn" data-page="${i+3}" aria-current="${i+3===current}">${i+1} · ${n}</button>`).join('')+'</nav>':'')+content;id('count').textContent=(current+1)+' / '+pages.length;id('body').scrollTop=0;}
function home(){modal.hidden=true;modal.classList.remove('show');id('home').inert=false;document.body.classList.remove('app-open');trigger?.focus();}
document.addEventListener('click',e=>{const go=e.target.closest('[data-page]');if(go){if(modal.hidden)trigger=go;show(Number(go.dataset.page));id('back').focus();}const t=e.target.closest('[data-tool]');if(t){const [n,,p,url]=tools[t.dataset.tool];id('tool-info').innerHTML=card(n,p+"。"+when[t.dataset.tool],link(url,'查看资料'));}});
id('back').onclick=home;id('next').onclick=()=>show(current+1);id('prev').onclick=()=>show(current-1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden){home();return;}if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(modal.hidden?0:current+(e.key==='ArrowRight'?1:-1));id('back').focus();}});
</script></body></html>
