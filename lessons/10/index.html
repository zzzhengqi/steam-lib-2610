<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第 10 节 · 蒸汽会员资源库</title>
<style>
/* =====================================================================
   蒸汽会员专属资源库 · 折叠屏手机界面（浅色版）
   配色与质感参考折叠屏展开视频：浅灰舞台、银色钛金属中框、细黑边框、
   浅色沙丘壁纸、白色毛玻璃小组件
   ===================================================================== */
:root{
  --bg:#ececef;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#8e8e93;--line:rgba(0,0,0,.08);
  --card:#fff;--card-h:#fff;--accent:#f26b1d;--accent2:#0a84ff;
  --ok:#1f9d55;--warn:#c27c0e;--plan:#6e6e73;--radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --unfold:cubic-bezier(.5,0,.15,1);
  --H:720px;--W:1080px;
  --metal:.34em;--bez:.42em;--rO:3.3em;--th:.9em;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent2)}
svg{display:block}
.preload *,.preload *::before,.preload *::after{transition:none!important}

/* ============ 舞台背景：明亮摄影棚 ============ */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(120% 90% at 50% 38%,#fbfbfc 0%,#eeeef1 48%,#dcdde2 100%)}
.steam{position:absolute;inset:-10%}
.steam i{position:absolute;bottom:-25%;border-radius:50%;opacity:.35;animation:rise 26s linear infinite;will-change:transform}
.steam i:nth-child(1){left:-5%;width:44vw;height:44vw;background:radial-gradient(circle,#ffd7bd,transparent 65%)}
.steam i:nth-child(2){left:30%;width:40vw;height:40vw;background:radial-gradient(circle,#cfe3f7,transparent 65%);animation-duration:31s;animation-delay:-9s}
.steam i:nth-child(3){left:62%;width:42vw;height:42vw;background:radial-gradient(circle,#ffe6cf,transparent 65%);animation-duration:28s;animation-delay:-16s}
.steam i:nth-child(4){left:78%;width:34vw;height:34vw;background:radial-gradient(circle,#dbe8f5,transparent 65%);animation-duration:34s;animation-delay:-4s}
.steam i:nth-child(5){left:14%;width:30vw;height:30vw;background:radial-gradient(circle,#fff,transparent 65%);animation-duration:22s;animation-delay:-12s;opacity:.6}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.8)}50%{transform:translate3d(6vw,-60vh,0) scale(1.15)}100%{transform:translate3d(-4vw,-125vh,0) scale(.9)}}
.stretch{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:.9;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%);-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%)}
.stretch .ln{white-space:nowrap;font-weight:800;font-size:clamp(60px,12vw,170px);line-height:.95;color:transparent;-webkit-text-stroke:1.2px rgba(0,0,0,.045);transform-origin:center;transform:scaleX(calc(var(--b,1) + var(--mx,0)*var(--k,.2)));transition:transform .6s var(--ease)}
.stretch .ln span{display:inline-block}
.stretch .ln:nth-child(even) span{animation-direction:reverse;animation-duration:60s}
.stretch .ln:nth-child(3){-webkit-text-stroke-color:rgba(242,107,29,.12)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============ 舞台与设备 ============ */
.stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center;perspective:2600px;perspective-origin:50% 42%}
.floater{position:relative;transform-style:preserve-3d}
.intro .floater{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.device{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;font-size:calc(var(--H) / 50);transition:transform 1.7s var(--unfold)}
.device.folded{transform:translateX(-25%) rotateX(12deg) rotateY(-26deg) rotateZ(-4deg) scale(.88)}
.device.tilt{transition:transform .9s var(--ease)}
.settled .device,.settled .floater,.settled .half{transform-style:flat}
.settled .front{backface-visibility:visible;-webkit-backface-visibility:visible}
.settled .cover{visibility:hidden}
.settled .app,.settled .spot{transform:none}
.ground{position:absolute;left:6%;right:6%;bottom:-7%;height:9%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,40,50,.32),rgba(40,40,50,.08) 55%,transparent 72%);filter:blur(14px);transition:left 1.6s var(--unfold),right 1.6s var(--unfold)}
.intro .ground{left:28%;right:52%}

.half{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d}
.half.left{left:0;transform-origin:100% 50%;transition:transform 1.6s var(--unfold)}
.half.right{left:50%}
/* 折叠：左半边翻到右半边正前方（外屏朝向观众），展开时向观众一侧、从右向左翻开 */
.device.folded .half.left{transform:rotateY(180deg) translateZ(calc(-1 * var(--th) - .12em))}

/* 银色钛金属中框（含拉丝纹理与边缘高光） */
/* 机身厚度：正反两面各前后偏移半个厚度，中间用多层金属切片填充（由脚本生成） */
.slab{position:absolute;inset:0;pointer-events:none;backface-visibility:visible}
.left .slab{border-radius:var(--rO) 0 0 var(--rO)}
.right .slab{border-radius:0 var(--rO) var(--rO) 0}
.settled .slab{display:none}
.front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(calc(var(--th) / 2));
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,rgba(0,0,0,.025) 1px 3px),
    linear-gradient(160deg,#fbfbfc 0%,#d3d6db 18%,#eef0f2 38%,#b9bdc3 62%,#e6e8eb 82%,#a7abb1 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -1px 2px rgba(0,0,0,.18)}
.left .front{border-radius:var(--rO) 0 0 var(--rO);padding:var(--metal) 0 var(--metal) var(--metal)}
.right .front{border-radius:0 var(--rO) var(--rO) 0;padding:var(--metal) var(--metal) var(--metal) 0}
/* 侧键 */
.right .front::before{content:"";position:absolute;right:-.26em;top:22%;width:.3em;height:4.2em;border-radius:0 .3em .3em 0;
  background:linear-gradient(90deg,#9ea2a8,#e9ebee 50%,#b6bac0);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.right .front::after{content:"";position:absolute;top:-.26em;right:16%;width:5.4em;height:.3em;border-radius:.3em .3em 0 0;
  background:linear-gradient(180deg,#9ea2a8,#e9ebee 50%,#b6bac0);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
/* 左半机身外侧：外屏（折叠时朝外，显示锁屏） */
.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg) translateZ(calc(var(--th) / 2))}
.cover{border-radius:0 var(--rO) var(--rO) 0;padding:var(--metal);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,rgba(0,0,0,.025) 1px 3px),
    linear-gradient(200deg,#fbfbfc 0%,#d3d6db 18%,#eef0f2 38%,#b9bdc3 62%,#e6e8eb 82%,#a7abb1 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -1px 2px rgba(0,0,0,.18)}
/* 外屏侧键（折叠时在右侧可见） */
.cover::before{content:"";position:absolute;right:-.26em;top:22%;width:.3em;height:4.2em;border-radius:0 .3em .3em 0;
  background:linear-gradient(90deg,#9ea2a8,#e9ebee 50%,#b6bac0);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.cscreen{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;border:var(--bez) solid #060708;
  border-radius:1.1em calc(var(--rO) - var(--metal)) calc(var(--rO) - var(--metal)) 1.1em}
.cover .wall{width:100%;left:0}
/* 翻动时外屏保持点亮，只是轻微变暗、变模糊，像真机一样 */
.cover .off{position:absolute;inset:0;z-index:20;background:#0b0d10;opacity:0;pointer-events:none;transition:opacity .6s ease}
.device:not(.folded) .cover .off{opacity:.18}
.cover .lock,.cover .wall{transition:filter .6s ease}
.device:not(.folded) .cover .lock,.device:not(.folded) .cover .wall{filter:blur(.5em)}
.lockm{display:none}

/* 屏幕：细黑边框 */
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#e9e3da;isolation:isolate;border:var(--bez) solid #060708}
.left .screen{border-right:0;border-radius:calc(var(--rO) - var(--metal)) 0 0 calc(var(--rO) - var(--metal))}
.right .screen{border-left:0;border-radius:0 calc(var(--rO) - var(--metal)) calc(var(--rO) - var(--metal)) 0}
/* 折痕 */
.left .screen::after,.right .screen::before{content:"";position:absolute;top:0;bottom:0;width:1.6em;z-index:9;pointer-events:none}
.left .screen::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.07) 80%,rgba(255,255,255,.25) 96%,rgba(0,0,0,.06))}
.right .screen::before{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.06) 85%,rgba(255,255,255,.2))}
.cam{position:absolute;top:.8em;left:50%;width:.82em;height:.82em;margin-left:-.41em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b2f3a 0 18%,#050608 30%);box-shadow:0 0 0 1.5px rgba(0,0,0,.6);z-index:10}

/* 壁纸：浅色天空 + 沙丘（缓慢流动） */
.wall{position:absolute;top:0;height:100%;width:200%;z-index:0;
  background:linear-gradient(180deg,#a9bed3 0%,#c8d5e2 26%,#ebe0d4 55%,#e7cdb2 78%,#d9b48f 100%)}
.left .wall{left:0}
.right .wall{left:-100%}
.wall i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate;will-change:transform}
/* 阅读板块时暂停背景动画，省电省性能 */
.app-open .steam i,.app-open .wall i{animation-play-state:paused}
.wall i:nth-child(1){width:95%;height:70%;left:-20%;top:62%;background:radial-gradient(ellipse at 50% 0%,#e8c7a3 0%,#d7a97e 45%,transparent 70%)}
.wall i:nth-child(2){width:90%;height:62%;left:38%;top:70%;background:radial-gradient(ellipse at 50% 0%,#f0d6ba 0%,#dcb48c 45%,transparent 70%);animation-duration:27s}
.wall i:nth-child(3){width:46%;height:60%;left:56%;top:-18%;background:radial-gradient(circle,rgba(255,250,240,.9),rgba(255,235,210,.35) 40%,transparent 66%);animation-duration:30s}
.wall i:nth-child(4){width:70%;height:40%;left:10%;top:38%;background:radial-gradient(ellipse,rgba(255,255,255,.55),transparent 65%);animation-duration:24s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-3%) scale(1.06)}100%{transform:translate(-3%,2%) scale(.97)}}

.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:0 1.3em 1.1em;transition:filter 1.4s var(--unfold) .1s,opacity .9s .3s}
.device.folded .left .content{filter:blur(1.4em) saturate(.8)}
.device.folded .right .content{opacity:0;transition:opacity .3s}
.shade{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(90deg,rgba(20,20,25,.45),rgba(20,20,25,.12));opacity:0;transition:opacity 1.6s var(--unfold)}
.device.folded .shade{opacity:1}

/* 状态栏 */
.sb{display:flex;justify-content:space-between;align-items:center;height:2.9em;padding:0 .6em;font-size:.95em;font-weight:650;flex:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.sb .ic{display:flex;gap:.35em;align-items:center}
.sb svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.bat{width:1.75em;height:.88em;border-radius:.28em;border:1.5px solid rgba(255,255,255,.9);position:relative;padding:1.5px}
.bat::after{content:"";position:absolute;right:-.24em;top:30%;width:.13em;height:40%;background:rgba(255,255,255,.9);border-radius:0 2px 2px 0}
.bat b{display:block;height:100%;width:82%;background:#fff;border-radius:1.5px}

/* ============ 锁屏（外屏） ============ */
.lock{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;padding:4em 1.4em 1.6em;cursor:pointer;color:#fff;
  transition:transform 1s var(--ease),opacity .8s}
.lock.gone{transform:translateY(-105%);opacity:0;pointer-events:none}
.device:not(.folded) .cover .lock{pointer-events:none}
.lock .ld{font-size:1.05em;font-weight:600;text-shadow:0 1px 6px rgba(40,60,90,.25)}
.lock .lt{font-size:6.6em;font-weight:700;letter-spacing:-.035em;line-height:1;margin:.04em 0 .14em;color:#fff;text-shadow:0 2px 18px rgba(40,60,90,.25)}
.lock .ln2{font-size:1.1em;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 6px rgba(40,60,90,.3)}
.lock .ln3{font-size:.78em;letter-spacing:.38em;margin-top:.35em;font-weight:700;color:rgba(255,255,255,.85)}
.notif{margin-top:2.2em;width:100%;padding:.9em 1em;border-radius:1.4em;color:var(--ink);background:rgba(255,255,255,.62);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 .4em 1.4em rgba(80,60,40,.12);display:flex;gap:.8em;align-items:center;text-align:left;animation:notif 1s var(--spring) .5s both}
@keyframes notif{from{opacity:0;transform:translateY(1em) scale(.94)}}
.notif .ni{flex:none;width:2.6em;height:2.6em;border-radius:.75em;display:grid;place-items:center;background:linear-gradient(150deg,#ffa25c,#ff5e3a)}
.notif .ni svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.notif b{display:block;font-size:.9em}
.notif span{font-size:.8em;color:var(--ink2)}
.unlock{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:.5em;font-size:.9em;color:rgba(40,30,20,.75);font-weight:600}
.unlock .arr{width:2.7em;height:2.7em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:pulse 1.8s ease-in-out infinite}
.unlock .arr svg{width:50%;height:50%;fill:none;stroke:#3a3a3c;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 .9em rgba(255,255,255,0)}}

/* ============ 小组件（白色毛玻璃） ============ */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:1em;padding:.5em .3em;flex:1;align-content:start;min-height:0}
.wg{position:relative;overflow:hidden;border-radius:1.7em;padding:1.1em 1.25em;text-align:left;cursor:pointer;border:0;color:var(--ink);
  background:rgba(255,255,255,.6);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  box-shadow:0 .3em 1.2em rgba(90,70,50,.1),inset 0 1px 0 rgba(255,255,255,.7);
  transform:perspective(60em) translateY(var(--ly,0)) scale(var(--ls,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .45s var(--spring),background .2s,box-shadow .3s}
.wg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(18em circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.75),transparent 60%)}
.wg:hover{--ly:-.18em;background:rgba(255,255,255,.72);box-shadow:0 1em 2.2em rgba(90,70,50,.16),inset 0 1px 0 rgba(255,255,255,.7)}
.wg:hover::after{opacity:.55}
.wg:active{--ls:.97}
.w-clock:hover{--ly:-.1em}
.wg .wh{font-size:.78em;letter-spacing:.1em;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:.4em}
.w-clock{grid-column:span 2;display:flex;align-items:flex-end;justify-content:space-between;gap:1em;padding:1.3em 1.4em;cursor:default}
.w-clock .t{font-size:4.6em;font-weight:700;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums}
.w-clock .d{font-size:.95em;color:var(--ink2);margin-top:.5em;font-weight:500}
.w-clock .n{text-align:right;font-size:.9em;font-weight:700;line-height:1.5}
.w-clock .n small{display:block;font-size:.78em;letter-spacing:.3em;color:var(--accent)}
.w-map ol{list-style:none;margin:.7em 0 0;padding:0;display:flex;flex-direction:column;gap:.55em}
.w-map li{display:grid;grid-template-columns:3.8em 1fr;white-space:nowrap;gap:.6em;align-items:center;font-size:.82em;font-weight:600}
.w-map li i{display:block;height:.45em;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;position:relative}
.w-map li i::after{content:"";position:absolute;inset:0;width:var(--p);border-radius:inherit;background:linear-gradient(90deg,#ff9a4d,var(--accent));transform-origin:left;animation:bar 1.4s var(--ease) both;animation-delay:var(--dl)}
@keyframes bar{from{transform:scaleX(0)}}
.w-stats .nums{display:grid;grid-template-columns:1fr 1fr;gap:.6em .8em;margin-top:.7em}
.w-stats b{display:block;font-size:2em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.w-stats .stat:nth-child(1) b{color:#f26b1d}.w-stats .stat:nth-child(2) b{color:#0a84ff}.w-stats .stat:nth-child(3) b{color:#30b158}
.w-stats span{font-size:.75em;color:var(--ink2)}
.w-prompt{grid-column:span 2}
.w-prompt .pt{font-size:1.15em;font-weight:700;margin:.45em 0 .2em}
.w-prompt .pd{font-size:.85em;color:var(--ink2);line-height:1.55}
.w-prompt .go{position:absolute;right:1.1em;top:1em;font-size:.78em;padding:.2em .8em;border-radius:999px;background:rgba(10,132,255,.12);color:#0a6fd6;font-weight:600}
.w-mini{display:flex;align-items:center;gap:.85em;padding:.95em 1.1em}
.w-mini .mi{flex:none;width:2.7em;height:2.7em;border-radius:.8em;display:grid;place-items:center;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 0 0 .5px rgba(0,0,0,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.w-mini .mi svg{width:55%;height:55%;fill:none;stroke:var(--gc,#fff);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w-mini b{display:block;font-size:1em}
.w-mini small{display:block;font-size:.78em;color:var(--ink2)}

/* ============ 图标 ============ */
.spill{display:flex;align-items:center;gap:.55em;margin:.2em .3em 1.1em;padding:.65em 1.1em;border-radius:999px;cursor:pointer;flex:none;border:0;
  background:rgba(255,255,255,.45);color:rgba(30,30,35,.6);font-size:.95em;backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:background .2s}
.spill:hover{background:rgba(255,255,255,.6)}
.spill svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.spill kbd{margin-left:auto;font-family:var(--mono);font-size:.8em;border:1px solid rgba(0,0,0,.15);border-radius:.4em;padding:0 .45em}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.7em .3em;padding:.2em .1em;align-content:start}
.ico{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.45em;cursor:pointer;color:var(--ink);min-width:0}
/* iOS 风格图标：系统色、自上而下的轻微渐变、约 22% 圆角，无厚重高光 */
.sq{position:relative;width:4.7em;height:4.7em;border-radius:22.5%;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--g1),var(--g2));
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 .35em .9em -.35em rgba(60,40,20,.35);
  transform:translateY(var(--ly,0)) scale(calc(var(--ls,1) * var(--ds,1))) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .4s var(--spring),box-shadow .3s,filter .2s}
.ico{perspective:22em}
.dock .sq{transform-origin:50% 100%}
/* 悬停扫光 */
.sq::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.65) 48%,transparent 64%);background-size:260% 100%;background-position:140% 0}
.ico:hover .sq::after{animation:shine .9s var(--ease)}
@keyframes shine{0%{opacity:1;background-position:140% 0}100%{opacity:1;background-position:-40% 0}}
.sq svg{position:relative;width:54%;height:54%;fill:none;stroke:var(--gc,#fff);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq .emo{font-size:2em;line-height:1}
.ico:hover .sq{--ly:-.28em;--ls:1.08;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1em 1.6em -.6em rgba(60,40,20,.5)}
.ico:active .sq{--ls:.9;filter:brightness(.92)}
.lb{transition:transform .35s var(--spring)}
.ico:hover .lb{transform:translateY(-.12em)}
.ico:focus-visible .sq{outline:2px solid var(--accent2);outline-offset:3px}
.lb{font-size:.8em;font-weight:500;color:#1d1d1f;text-shadow:0 0 6px rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ico.opening .sq{visibility:hidden}
.dock{margin-top:auto;flex:none;display:flex;justify-content:space-around;align-items:center;padding:.85em .5em;border-radius:2.3em;
  background:rgba(255,255,255,.38);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 .3em 1em rgba(90,60,30,.08)}
.dock .lb{display:none}

/* 入场 */
.ico,.wg,.spill,.dock{opacity:0}
.ready .ico{animation:pop .7s var(--spring) both;animation-delay:calc(var(--i,0) * 32ms + 80ms)}
.ready .wg{animation:wgIn .9s var(--ease) both;animation-delay:calc(var(--i,0) * 90ms)}
.ready .spill,.ready .dock{animation:wgIn .8s var(--ease) both .15s}
/* 展开时左屏内容已在，从模糊变清晰（参考视频） */
.unfolding .left .wg{opacity:1}
.ready .left .wg{animation:none;opacity:1}
.ready .ico.popped,.ready .wg.popped{animation:none;opacity:1}

/* ============ 拖动排序 ============ */
.content{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ico,.wg{touch-action:manipulation}
.placeholder{opacity:.22!important}
.placeholder .sq,.placeholder.wg{box-shadow:none!important}
body.editing .ico:not(.placeholder) .sq{animation:jiggle .26s ease-in-out infinite alternate}
body.editing .ico:nth-child(even):not(.placeholder) .sq{animation-delay:-.13s}
body.editing .wg:not(.placeholder){animation:jiggleW .32s ease-in-out infinite alternate}
@keyframes jiggle{from{rotate:-2deg}to{rotate:2deg}}
@keyframes jiggleW{from{rotate:-.45deg}to{rotate:.45deg}}
.ghost{position:fixed!important;z-index:1000;margin:0;pointer-events:none;opacity:1!important;animation:none!important;
  transform:scale(1);transition:transform .25s var(--spring),filter .25s,left .3s var(--ease),top .3s var(--ease);will-change:left,top}
.ghost.lift{transform:scale(1.12) rotate(-2deg);filter:drop-shadow(0 22px 26px rgba(40,30,20,.28));transition:transform .25s var(--spring),filter .25s}
.ghost.drop{transform:scale(1);filter:none}
.ghost .lb{opacity:0}
.ghost.wg{color:var(--ink);background:rgba(255,255,255,.85)}
/* 左屏空白处可拖动合上手机 */
.settled:not(.m) #homeL{cursor:grab}
.folding,.folding *{cursor:grabbing!important}
.folding .content{user-select:none}
.hint button{background:none;border:0;padding:0;color:var(--accent2);cursor:pointer;font-size:inherit;letter-spacing:inherit}
.hint button:hover{text-decoration:underline}
.sr-reset{align-self:center;margin:0 0 6px;padding:6px 14px;border-radius:999px;border:0;background:rgba(10,132,255,.1);color:var(--accent2);cursor:pointer;font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(1em)}to{opacity:1;transform:none}}
@keyframes wgIn{from{opacity:0;transform:translateY(1.4em) scale(.96)}to{opacity:1;transform:none}}

.hint{position:absolute;left:0;right:0;bottom:3.2vh;margin:0;text-align:center;color:#8e8e93;font-size:13px;letter-spacing:.12em;transition:opacity .5s}

/* ============ 应用窗口（浅色） ============ */
.app{position:absolute;z-index:30;inset:calc(var(--metal) + var(--bez));border-radius:calc(var(--rO) - var(--metal) - var(--bez));overflow:hidden;display:flex;flex-direction:column;
  background:#f5f5f7;transform:translateZ(calc(var(--th) * .5 + 4px));transform-origin:0 0;font-size:15px;color:var(--ink)}
.app[hidden]{display:none}
.app-bg{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,var(--g1),var(--g2));opacity:0}
.app-head{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.app-head svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.app-back{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent2);cursor:pointer;padding:6px 8px 6px 2px;border-radius:10px;font-size:15px;flex:none}
.app-back:hover{background:rgba(0,0,0,.04)}
.app-title{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;min-width:0;margin-right:58px}
.app-title .mini{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.app-title .mini svg{width:60%;height:60%;stroke:var(--gc,#fff);stroke-width:2.2}
.app-title .mini .emo{font-size:15px}
.app-title span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:none;border:0;cursor:pointer;color:var(--ink2);padding:8px;border-radius:10px}
.hbtn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.app-body{position:relative;z-index:1;flex:1;overflow:auto;overscroll-behavior:contain;padding:28px 36px 80px;line-height:1.75;scrollbar-width:thin}
.app-body .wrap{max-width:1000px;margin:0 auto}
.app-body h2{margin:0 0 6px;font-size:30px;letter-spacing:-.02em;font-weight:700}
.app-body .intro{color:var(--ink2);margin:0 0 24px;max-width:760px}
.app-foot{margin-top:40px;color:var(--ink3);font-size:12.5px;text-align:center}
.hbar{position:absolute;z-index:6;bottom:8px;left:50%;width:132px;height:5px;margin-left:-66px;border-radius:9px;border:0;padding:0;background:rgba(0,0,0,.4);cursor:pointer}
.hbar::before{content:"";position:absolute;inset:-12px -10px}
.app.show .item{animation:itemIn .65s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes itemIn{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
.item.flash{animation:flash 1.6s ease both!important}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--accent),0 0 26px rgba(242,107,29,.3)}100%{box-shadow:0 0 0 0 transparent}}

/* ============ 全局搜索（浅色毛玻璃） ============ */
.spot{position:absolute;z-index:40;inset:calc(var(--metal) + var(--bez));border-radius:calc(var(--rO) - var(--metal) - var(--bez));display:flex;flex-direction:column;align-items:center;padding:2.6em 1.4em 1.4em;
  background:rgba(240,238,235,.6);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);transform:translateZ(calc(var(--th) * .5 + 6px));
  opacity:0;transition:opacity .25s;font-size:15px}
.spot.show{opacity:1}
.spot[hidden]{display:none}
.spot-box{width:min(640px,100%);display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 6px 24px rgba(0,0,0,.08);
  transform:translateY(-12px) scale(.97);transition:transform .45s var(--spring)}
.spot.show .spot-box{transform:none}
.spot-box svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round}
.spot-box input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:17px;font-family:inherit}
.spot-x{background:none;border:0;color:var(--accent2);cursor:pointer;font-size:15px;padding:2px 4px}
.spot-res{width:min(640px,100%);margin-top:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.sr{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:14px;border:0;background:rgba(255,255,255,.6);cursor:pointer;animation:itemIn .4s var(--ease) both}
.sr:hover,.sr:focus-visible{background:#fff;outline:none}
.sr .mini{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.sr .mini svg{width:58%;height:58%;fill:none;stroke:var(--gc,#fff);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr div{min-width:0}
.spot-empty{color:var(--ink2);text-align:center;padding:30px 0;font-size:14px}

/* ============ 内容样式（浅色卡片） ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{--rx:0deg;--ry:0deg;--gx:50%;--gy:50%;position:relative;background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .35s var(--ease),box-shadow .25s,border-color .25s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--gx) var(--gy),rgba(242,107,29,.07),transparent 60%)}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.08)}
.card:hover::before{opacity:1}
.card.tilting{transition:transform .08s linear,box-shadow .25s,border-color .25s}
.card h3{margin:0;font-size:16.5px;line-height:1.45;font-weight:650}
.card p{margin:0;color:var(--ink2);font-size:14.2px}
.card.slot{border:1.5px dashed rgba(10,132,255,.35);background:rgba(10,132,255,.035);box-shadow:none}
.card.slot h3::before{content:"待设置 · ";color:var(--accent2);font-size:12.5px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 9px;border-radius:999px;background:rgba(0,0,0,.05);color:var(--ink2)}
.badge{font-size:12px;padding:1px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-done{background:rgba(52,199,89,.14);color:var(--ok)}
.b-wip{background:rgba(255,159,10,.16);color:var(--warn)}
.b-plan{background:rgba(0,0,0,.05);color:var(--plan)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row .tag,.row .badge{flex:none;white-space:nowrap}
.card.wide{grid-column:1/-1}
.card.hl{border-color:rgba(10,132,255,.22);background:linear-gradient(180deg,rgba(10,132,255,.06),#fff 70%)}
.card ul{margin:2px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.card li{margin:3px 0}
.card .note{font-size:12.5px;color:var(--ink3)}
.tbl-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(0,0,0,.07);border-radius:12px;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.55;min-width:560px}
.tbl th{text-align:left;font-weight:650;color:var(--ink);background:#f5f5f7;padding:9px 12px;white-space:nowrap;border-bottom:1px solid rgba(0,0,0,.07)}
.tbl td{padding:9px 12px;color:var(--ink2);vertical-align:top;border-top:1px solid rgba(0,0,0,.05)}
.tbl tr:first-child td{border-top:0}
.tbl td.k{color:var(--ink);font-weight:600;white-space:nowrap}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.lv-i{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.55}
.lv-i b{font-size:14px}
.lv-i span{color:var(--ink2)}
.lv-g{background:rgba(52,199,89,.1)}.lv-g b{color:#1a7f3c}
.lv-y{background:rgba(255,179,0,.13)}.lv-y b{color:#9a6400}
.lv-r{background:rgba(255,59,48,.09)}.lv-r b{color:#c4271d}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{font:inherit;font-size:13px;padding:5px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.1);background:#fff;color:var(--ink2);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent2);color:var(--accent2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.item.off{display:none}
.m .tbl{min-width:0}
.m .tbl thead{display:none}
.m .tbl tr{display:block;padding:11px 14px;border-top:1px solid rgba(0,0,0,.06)}
.m .tbl tr:first-child{border-top:0}
.m .tbl td{display:block;padding:2px 0;border:0;white-space:normal}
.m .tbl td::before{content:attr(data-l) "：";color:var(--ink);font-weight:600}
.m .tbl td.k{font-size:15px;margin-bottom:3px}
.m .tbl td.k::before{content:none}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:6px 15px;border-radius:999px;border:1px solid rgba(0,0,0,.1);background:#fff;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent2);color:var(--accent2)}
.btn.pri{background:var(--accent2);border:0;color:#fff;font-weight:600}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
.btn:not(.pri) .ripple{background:rgba(10,132,255,.2)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.steps{display:flex;flex-direction:column;position:relative;margin-left:4px}
.step{display:grid;grid-template-columns:46px 1fr;gap:18px;padding-bottom:22px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:22px;top:46px;bottom:0;width:2px;background:linear-gradient(rgba(242,107,29,.5),transparent)}
.num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(150deg,#ffa25c,#f26b1d);color:#fff;box-shadow:0 4px 12px rgba(242,107,29,.3)}
.step .body{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:var(--radius);padding:16px 20px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
.step h3{margin:0 0 4px;font-size:16.5px;font-weight:650}
.step p{margin:0;color:var(--ink2);font-size:14.2px}
.step ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14.2px}
.step .codebox{margin-top:10px}
.codebox{position:relative}
pre.code{margin:0;background:#f5f5f7;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:38px 16px 14px;font-family:var(--mono);font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:#1d1d1f;max-height:300px;overflow:auto}
.codebox .btn.copy{position:absolute;right:8px;top:8px;padding:3px 11px;font-size:12px}
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
details{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:16px;padding:0 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.035);transition:box-shadow .25s}
details[open]{box-shadow:0 2px 4px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.07)}
summary{cursor:pointer;padding:15px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary .no{flex:none;font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:rgba(242,107,29,.1);color:var(--accent)}
summary .tt{flex:1}
summary::after{content:"+";color:var(--ink3);font-size:22px;line-height:1;transition:transform .3s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details .ans{padding:2px 0 18px;color:var(--ink2);font-size:14.5px}
details .ans h4{margin:16px 0 6px;color:var(--ink);font-size:14px}
details .ans ul,details .ans ol{margin:4px 0;padding-left:20px}
details .ans li{margin:3px 0}
details .ans .codebox{margin-top:10px}
.goal{padding:10px 14px;border-radius:12px;background:rgba(10,132,255,.07);color:#0b5cad}
.ans code,.card code,.step code{font-family:var(--mono);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:5px;font-size:.92em;color:#c2410c}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.plan .card h3{display:flex;gap:10px;align-items:center}
.plan .wk{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:linear-gradient(150deg,#ffa25c,#f26b1d);color:#fff;white-space:nowrap}
.plan ul{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.plan li{margin:4px 0}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gl .card h3{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);background:rgba(29,29,31,.9);color:#fff;padding:9px 22px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:99;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 手机模式：设备就是屏幕 ============ */
.m .device{width:100vw;height:var(--H);font-size:15px}
.m .device.folded{transform:scale(.7) rotateX(14deg) rotateY(-18deg) rotateZ(-4deg)}
.m .half.left{display:none}
.m .lockm{display:flex}
.m .half.right{left:0;width:100%}
.m .right .front{padding:0;border-radius:0;transition:padding 1.3s var(--unfold),border-radius 1.3s var(--unfold)}
.m .right .slab{border-radius:56px}
.m .right .front::before,.m .right .front::after{opacity:0;transition:opacity .8s}
.m .right .screen{border-width:0;border-radius:0;transition:border-radius 1.3s var(--unfold),border-width 1.3s var(--unfold)}
.m .device.folded .right .front{padding:7px;border-radius:56px}
.m .device.folded .right .front::before,.m .device.folded .right .front::after{opacity:1}
.m .device.folded .right .screen{border-width:9px;border-radius:49px}
.m .right .screen::before{display:none}
.m .content{overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) 16px calc(14px + env(safe-area-inset-bottom));scrollbar-width:none}
.m .content::-webkit-scrollbar{display:none}
.m .wgrid{flex:none;gap:12px;padding:4px 0 14px}
.m .w-map,.m .w-mini{display:none}
.m .w-clock{padding:1em 1.2em}
.m .w-clock .t{font-size:3.1em}
.m .w-stats{grid-column:span 2}
.m .w-stats .nums{grid-template-columns:repeat(4,1fr)}
.m .w-stats b{font-size:1.7em}
.m .igrid{gap:18px 4px;margin-bottom:18px}
.m .sq{width:3.9em;height:3.9em}
.m .dock{position:sticky;bottom:0;margin-top:auto;background:rgba(255,255,255,.55)}
.m .app,.m .spot{inset:0;border-radius:0}
.m .app-head{padding-top:max(14px,env(safe-area-inset-top))}
.m .app-back span{display:none}
.m .app-title{margin-right:30px}
.m .app-body{padding:20px 16px 70px}
.m .prompt-grid,.m .grid,.m .gl{grid-template-columns:minmax(0,1fr)}
.m .hint,.m .ground{display:none}
.m .lock{padding-top:max(4.5em,env(safe-area-inset-top))}
.m .lock .lt{font-size:5.6em}
.m .spot{padding-top:max(20px,env(safe-area-inset-top))}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

let ctxPct = 22;
function addCtx(amount) {
  ctxPct = Math.min(98, ctxPct + amount);
  updateMeter();
}
function compactCtx() {
  ctxPct = Math.min(ctxPct, Math.max(32, Math.floor(ctxPct * 0.45)));
  updateMeter(true);
}
function resetCtx() {
  ctxPct = 15;
  updateMeter();
}
function updateMeter(compacted = false) {
  const fill = document.getElementById('meterFill');
  const status = document.getElementById('deskStatus');
  fill.style.width = ctxPct + '%';
  fill.parentElement.setAttribute('aria-valuenow', ctxPct);
  const level = ctxPct >= 80 ? 'danger' : ctxPct >= 50 ? 'warn' : '';
  fill.style.background = { danger: '#ff3b30', warn: '#ff9500', '': '#34c759' }[level];
  document.getElementById('meterNum').textContent = ctxPct + '%' +
    { danger: '（严重爆满）', warn: '（有点拥挤）', '': '（头脑清醒）' }[level];
  status.className = 'desk-status' + (level ? ' ' + level : '');
  status.textContent = compacted ? '🗜️ 模拟压缩完成，请核对最初的关键约束。' : {
    danger: '🚨 模拟上下文接近上限，较早的要求可能被遗漏。',
    warn: '⚠️ 桌面资料越来越多，可以考虑压缩并核对约束。',
    '': '✅ 桌面空间充足，可以继续当前任务。'
  }[level];
}


const keys = Object.keys(modalData);
const overlay = document.getElementById('modalOverlay');
const content = document.getElementById('modalContent');

function openModal(key) {
  const data = modalData[key];
  if (!data) return;
  content.innerHTML = '<div class="modal-header"><div class="modal-title-wrap"><span class="modal-badge">'
    + data.badge + '</span><h2 class="modal-title" id="modalTitle">' + data.title
    + '</h2></div><button class="close-btn" type="button" onclick="closeModal()" aria-label="关闭">✕</button></div>'
    + data.html;
  if (key === 'desk') updateMeter();
  if (!overlay.open) overlay.showModal();
  content.scrollTop = 0;
  content.querySelector('.close-btn').focus();
}

function closeModal() {
  overlay.close();
}

document.addEventListener('keydown', event => {
  if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[1-6]$/.test(event.key)) {
    openModal(keys[Number(event.key) - 1]);
  }
});

async function copyPrompt() {
  const prompt = document.getElementById('promptText');
  const button = document.getElementById('copyBtn');
  const text = prompt.textContent.trim().replace(/^“|”$/g, '');
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch {
    const field = document.createElement('textarea');
    field.value = text;
    field.className = 'copy-field';
    content.append(field);
    field.select();
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
  }
  if (!button.isConnected || !overlay.open) return;
  button.focus();
  if (!copied) {
    const range = document.createRange();
    range.selectNodeContents(prompt);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }
  button.textContent = copied ? '已复制 ✓' : '请手动复制选中文字';
}
