<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第 11 节 · 规则文件：给 Agent 一本项目手册</title>
<style>
:root{
  --bg:#ececef;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#8e8e93;--line:rgba(0,0,0,.08);
  --accent:#f26b1d;--accent2:#0a84ff;--ok:#1f9d55;--warn:#c27c0e;--danger:#ff3b30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#fbfbfc 0%,#eeeef1 48%,#dcdde2 100%);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:grid;place-items:center}
button{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}

/* ============ 课程舞台框架（与第 10 课视觉统一） ============ */
.lesson{width:min(1320px,96vw);height:min(850px,94dvh);position:relative;border-radius:32px;background:#161618;padding:8px;box-shadow:0 0 0 4px #bfc0c5,0 30px 80px #3334;overflow:hidden}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:25px;background:#e9e3da;isolation:isolate;border:6px solid #060708}
.wall{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#a9bed3 0%,#c8d5e2 26%,#ebe0d4 55%,#e7cdb2 78%,#d9b48f 100%)}
.wall i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
.wall i:nth-child(1){width:85%;height:65%;left:-15%;top:62%;background:radial-gradient(ellipse at 50% 0%,#e8c7a3 0%,#d7a97e 45%,transparent 70%)}
.wall i:nth-child(2){width:80%;height:58%;left:36%;top:70%;background:radial-gradient(ellipse at 50% 0%,#f0d6ba 0%,#dcb48c 45%,transparent 70%);animation-duration:27s}
.wall i:nth-child(3){width:46%;height:60%;left:56%;top:-18%;background:radial-gradient(circle,rgba(255,250,240,.9),rgba(255,235,210,.35) 40%,transparent 66%);animation-duration:30s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-3%) scale(1.06)}100%{transform:translate(-3%,2%) scale(.97)}}

.launcher{position:relative;z-index:2;width:min(100%,1200px);height:100%;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;justify-items:stretch;column-gap:clamp(26px,6vw,90px);padding:clamp(18px,4vw,72px)}
.wg{position:relative;overflow:hidden;border-radius:28px;border:0;color:var(--ink);
  background:linear-gradient(145deg,rgba(232,242,252,.84),rgba(255,248,238,.68));
  backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  box-shadow:0 10px 30px rgba(90,70,50,.12),inset 0 1px 0 rgba(255,255,255,.75);
  padding:clamp(24px,3vw,46px)}
.wg .wh{color:#b74609;font-size:14px;letter-spacing:.1em;font-weight:700}
.wg .chapter{margin:24px 0 10px;font-weight:600;color:var(--ink2);font-size:16px}
.launcher h1{font-size:clamp(32px,4.6vw,62px);margin:0;line-height:1.12;letter-spacing:-.035em}
.course-summary{margin:18px 0 0;color:#555;line-height:1.65;font-size:16px}
.course-path{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.course-path span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#ffffffa6;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.5vw,38px) clamp(10px,1.5vw,22px);text-align:center;align-items:start}
.ico{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.65em;cursor:pointer;color:var(--ink);font-size:clamp(11px,1.4vw,18px);perspective:22em}
.sq{position:relative;width:4.7em;height:4.7em;border-radius:22.5%;display:grid;place-items:center;
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 .35em .9em -.35em rgba(60,40,20,.35);
  transition:transform .4s var(--spring),box-shadow .3s,filter .2s}
.sq svg{width:50%;height:50%;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico:hover .sq{transform:translateY(-.28em) scale(1.08);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1em 1.6em -.6em rgba(60,40,20,.5)}
.ico:active .sq{transform:scale(.92);filter:brightness(.92)}
.lb{font-size:.82em;font-weight:600;color:#1d1d1f;text-shadow:0 0 6px rgba(255,255,255,.7);transition:transform .35s var(--spring)}
.ico:hover .lb{transform:translateY(-.12em)}

/* ============ 弹窗与通用组件 ============ */
dialog.modal-overlay{--glass-strong:rgba(255,255,255,.96);--text:#1d1d1f;--sub:#515154;--orange:#b64b0a;--btn:#ff8c00;
  color:var(--text);position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:24px;
  background:rgba(25,25,28,.36);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;z-index:100}
dialog.modal-overlay:not([open]){display:none}
dialog.modal-overlay::backdrop{background:transparent}
.modal-card{width:min(960px,94vw);max-height:88vh;background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:32px;box-shadow:0 32px 64px rgba(0,0,0,.22);padding:34px 40px;overflow-y:auto;overflow-x:hidden;animation:cardPop .28s var(--ease)}
@keyframes cardPop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.modal-card :is(h2,h3,p,ul,pre){margin:0}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(0,0,0,.07)}
.modal-title-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.modal-badge{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,140,0,.14);color:var(--orange);white-space:nowrap}
.modal-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.close-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.06);font-size:18px;cursor:pointer;transition:.2s}
.close-btn:hover{background:rgba(0,0,0,.13)}
.lead-box{background:#f5f5f7;border-left:4px solid var(--btn);padding:14px 18px;border-radius:12px;font-size:15.5px;font-weight:600;margin-bottom:20px;line-height:1.55}
.lead-box code,.sub-card code,.rule-text code{font-family:var(--mono);background:rgba(255,140,0,.12);color:#b64b0a;padding:1px 6px;border-radius:6px;font-size:.92em}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sub-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:20px;padding:22px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.sub-card.highlight{border:2px solid var(--btn);background:linear-gradient(#fffaf3,#fff)}
.sub-card.safe{border:2px solid #34c759;background:linear-gradient(#f3fcf5,#fff)}
.sub-card.bad{border:1.5px solid rgba(255,59,48,.28);background:linear-gradient(#fff6f6,#fff)}
.sub-card h3{font-size:17.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sub-card p,.sub-card li{font-size:14.8px;color:var(--sub);line-height:1.68}
.sub-card ul{padding-left:18px;margin-top:8px}
.sub-card li{margin-bottom:6px}

.demo-btn{background:var(--btn);color:#fff;border:0;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(255,140,0,.25);transition:.2s}
.demo-btn:hover{filter:brightness(.94);transform:translateY(-1px)}
.demo-btn.ghost{background:#e5e5ea;color:#1d1d1f;box-shadow:none}
.demo-btn.safe{background:#34c759;box-shadow:0 4px 12px rgba(52,199,89,.25)}
.demo-btn.danger{background:#ff3b30;box-shadow:0 4px 12px rgba(255,59,48,.22)}
.demo-btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}

/* 模块 1：工位墙对比模拟 */
.desk-compare-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mode-pill{padding:8px 16px;border-radius:999px;border:1.5px solid rgba(0,0,0,.1);background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.mode-pill.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.chat-sim{background:#1c1c1e;color:#f2f2f7;border-radius:18px;padding:18px 20px;font-size:14px;line-height:1.65}
.chat-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:12px;font-weight:600}
.chat-tag.ok{background:rgba(52,199,89,.18);color:#63e685}
.chat-tag.warn{background:rgba(255,69,58,.2);color:#ff8a80}
.bubble{padding:11px 14px;border-radius:12px;margin-bottom:10px}
.bubble.user{background:#2c2c2e;border-left:3px solid #0a84ff}
.bubble.ai{background:#252528;border-left:3px solid #ff9f0a}
.bubble.ai.good{border-left-color:#34c759}
.bubble strong{display:block;font-size:12px;color:#aeaeb2;margin-bottom:3px}

/* 模块 2：目录树 + /init 流程 */
.tree-box{background:#1c1c1e;color:#e5e5ea;border-radius:16px;padding:18px 20px;font-family:var(--mono);font-size:13.5px;line-height:1.85}
.tree-hi{display:inline-block;background:rgba(255,140,0,.22);color:#ffb347;padding:1px 8px;border-radius:6px;font-weight:700;border:1px solid rgba(255,140,0,.45)}
.step-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.step-card{background:#f5f5f7;border-radius:16px;padding:16px 18px;border-top:3px solid var(--btn)}
.step-card strong{display:block;font-size:15.5px;margin-bottom:6px}
.step-card p{font-size:14px;color:var(--sub);line-height:1.6}

/* 模块 3：互动排雷台（留红线 / 删废话） */
.score-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f5f7;padding:12px 16px;border-radius:14px;margin-bottom:14px;font-size:14px;font-weight:700;flex-wrap:wrap}
.rule-list{display:flex;flex-direction:column;gap:10px}
.rule-item{background:#fff;border:1.5px solid rgba(0,0,0,.08);border-radius:16px;padding:13px 16px;transition:.25s}
.rule-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.rule-text{font-size:14.5px;font-weight:600;line-height:1.5;flex:1}
.rule-actions{display:flex;gap:8px;flex:none}
.rule-fb{margin-top:9px;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.55;display:none}
.rule-item.right{border-color:#34c759;background:#f4fdf6}
.rule-item.right .rule-fb{display:block;background:rgba(52,199,89,.12);color:#146c32}
.rule-item.wrong{border-color:#ff3b30;background:#fff6f6}
.rule-item.wrong .rule-fb{display:block;background:rgba(255,59,48,.1);color:#b91c1c}
.rule-item.deleted .rule-text{text-decoration:line-through;color:#8e8e93}

/* 模块 4：15 行黄金模板切换 */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mini-pill-card{background:#f5f5f7;border-radius:14px;padding:12px 14px;border-top:3px solid var(--btn)}
.mini-pill-card b{display:block;font-size:14px;margin-bottom:4px}
.mini-pill-card span{font-size:12.5px;color:var(--sub);line-height:1.45;display:block}
.tpl-tabs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tpl-code{background:#1c1c1e;color:#f2f2f7;border-radius:16px;padding:18px 20px;font-family:var(--mono);font-size:13.2px;line-height:1.72;white-space:pre-wrap;border:1px solid rgba(255,255,255,.08)}

/* 模块 5：钓鱼测试模拟器 */
.fish-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fish-log{background:#1c1c1e;color:#f2f2f7;border-radius:18px;padding:18px 20px;min-height:210px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.65}
.fish-badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;background:rgba(52,199,89,.2);color:#63e685;margin-left:6px}

/* 提示词复制箱 & 自检清单 */
.prompt-box{background:#f2f2f7;border:1px dashed #aeaeb2;border-radius:16px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}
.prompt-text{font-size:14px;font-weight:600;line-height:1.55;white-space:pre-line;user-select:text;flex:1}
.check-item{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;margin-bottom:10px;cursor:pointer;font-size:15.5px;font-weight:600;text-align:left;transition:.2s}
.check-item.checked{background:#f0fdf4;border-color:#34c759;color:#15803d}
.check-box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid #c7c7cc;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.check-item.checked .check-box{background:#34c759;border-color:#34c759;color:#fff}
.copy-field{position:fixed;opacity:0}

@media(max-width:780px){
  .launcher{grid-template-columns:1fr;gap:22px;overflow:auto}
  .compare-grid,.step-2,.grid-4{grid-template-columns:1fr}
  .modal-card{padding:22px 18px;border-radius:22px}
  .rule-top{flex-direction:column;align-items:flex-start}
  .prompt-box{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<main class="lesson">
  <div class="screen">
    <div class="wall"><i></i><i></i><i></i></div>
    <div class="launcher">
      <section class="wg course-widget">
        <div class="wh">STEAM · 蒸汽会员资源库</div>
        <div class="chapter">主修课 · 第 11 节</div>
        <h1>规则文件：<br>给 Agent 一本项目手册</h1>
        <p class="course-summary">写一份 15 行以内的 AGENTS.md，让 Codex 每次开新对话都自带“岗位记忆”，不再反复念经。</p>
        <div class="course-path">
          <span>墙上贴红线</span>
          <span>/init 瘦身</span>
          <span>留硬规删废话</span>
          <span>钓鱼测试验收</span>
        </div>
      </section>

      <section class="tiles" aria-label="本节课程模块">
        <button class="ico" type="button" onclick="openModal('why')">
          <span class="sq" style="background:linear-gradient(145deg,#2b95ff,#0066e6)">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
          <span class="lb">为什么需要手册</span>
        </button>

        <button class="ico" type="button" onclick="openModal('init')">
          <span class="sq" style="background:linear-gradient(145deg,#56ccf2,#2f80ed)">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          </span>
          <span class="lb">/init 起草与瘦身</span>
        </button>

        <button class="ico" type="button" onclick="openModal('audit')">
          <span class="sq" style="background:linear-gradient(145deg,#ff9f0a,#ff6b00)">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </span>
          <span class="lb">互动排雷：删废话</span>
        </button>

        <button class="ico" type="button" onclick="openModal('template')">
          <span class="sq" style="background:linear-gradient(145deg,#7f7fd5,#5856d6)">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </span>
          <span class="lb">15 行黄金模板</span>
        </button>

        <button class="ico" type="button" onclick="openModal('verify')">
          <span class="sq" style="background:linear-gradient(145deg,#4cd964,#28a745)">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
          </span>
          <span class="lb">钓鱼测试验收</span>
        </button>

        <button class="ico" type="button" onclick="openModal('practice')">
          <span class="sq" style="background:linear-gradient(145deg,#3a3a3c,#1c1c1e)">
            <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
          </span>
          <span class="lb">练习与过关自检</span>
        </button>
      </section>
    </div>
  </div>
</main>

<dialog class="modal-overlay" id="modalOverlay" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalContent"></div>
</dialog>

<script>
const auditRules = [
  {
    id: 0,
    text: "本项目包含 index.html、assets 文件夹和 images 文件夹。",
    shouldKeep: false,
    reason: "【该删】Codex 扫一眼项目目录就全知道了，把代码里本来就有的信息写进手册，只会白白挤占上下文。"
  },
  {
    id: 1,
    text: "写代码要注重工程规范，保持界面高级、优雅、有设计感。",
    shouldKeep: false,
    reason: "【该删】太虚！AI 没法把“高级优雅”翻译成具体动作，不如直接写“浅灰背景 + 暖橙高亮按钮”。"
  },
  {
    id: 2,
    text: "保持纯前端单文件运行，严禁引入 React / Vue 或新建 package.json。",
    shouldKeep: true,
    reason: "【必留】这是 Codex 猜不到的“架构红线”，一句话就能拦住 90% 的过度设计。"
  },
  {
    id: 3,
    text: "动画画幅固定 1080×1920（9:16 竖屏），导出命令为 npm run render。",
    shouldKeep: true,
    reason: "【必留】明确了硬尺寸标准和真实可执行命令，下次让它出片不用再猜参数。"
  },
  {
    id: 4,
    text: "严禁修改或删除 assets/raw/ 里的原始素材，每次改动后需在手机宽度下检查排版。",
    shouldKeep: true,
    reason: "【必留】既有“禁区保护”，又有“交付自检动作”，每一字都能直接落地。"
  },
  {
    id: 5,
    text: "这是一个使用 HTML5 和 CSS3 开发的个人网页应用。",
    shouldKeep: false,
    reason: "【该删】打开 index.html 第一行就写着 <!doctype html>，这是典型废话。"
  }
];

const templates = {
  anim: {
    label: "🎬 动画视频项目（12 行）",
    code: `# 项目规则（AGENTS.md）

## 预览与导出
- 实时预览：运行 \`npm run dev\`，在浏览器打开预览页检查节奏
- 导出成品：运行 \`npm run build:mp4\`，输出至 \`out/final.mp4\`

## 硬标准
- 画幅严格锁定 1080x1920（9:16 竖屏），30fps，不可擅自改横屏
- 字幕统一使用无衬线粗体，底部留白不低于 180px

## 禁止事项
- 严禁修改、重命名或删除 \`assets/raw/\` 下的原始音视频素材
- 未经确认，不要升级依赖版本或更换渲染引擎`
  },
  web: {
    label: "🗂️ 个人作品集网页（12 行）",
    code: `# 项目规则（AGENTS.md）

## 预览与验收
- 预览方式：直接用浏览器打开 \`index.html\` 即可查看效果
- 改完验收：必须确认桌面端与 390px 手机端均无按钮换行错位

## 风格约束
- 保持浅色苹果毛玻璃风格、圆角卡片，主强调色固定 \`#ff8c00\`
- 所有中文文案口语化，避免生硬技术术语

## 禁止事项
- 必须保持纯前端单文件运行，严禁引入 React/Vue 或安装 npm 包
- 严禁修改 \`assets/library.css\` 及已有作品截图文件`
  }

const keys = Object.keys(modalData);
const overlay = document.getElementById('modalOverlay');
const content = document.getElementById('modalContent');

function openModal(key) {
  const data = modalData[key];
  if (!data) return;
  content.innerHTML =
    '<div class="modal-header"><div class="modal-title-wrap"><span class="modal-badge">' +
    data.badge + '</span><h2 class="modal-title" id="modalTitle">' + data.title +
    '</h2></div><button class="close-btn" type="button" onclick="closeModal()" aria-label="关闭">✕</button></div>' +
    data.html;
  if (key === 'why') switchWhyMode('no');
  if (key === 'audit') renderAudit();
  if (key === 'template') switchTpl(activeTpl);
  if (key === 'verify') runFish(0);
  if (!overlay.open) overlay.showModal();
  content.scrollTop = 0;
  content.querySelector('.close-btn').focus();
}

function closeModal() {
  overlay.close();
}

function switchWhyMode(mode) {

    `;

}

function renderAudit() {
  const list = document.getElementById('ruleList');
  if (!list) return;
  let done = 0, correct = 0;
  list.innerHTML = auditRules.map(r => {
    const pick = auditState[r.id];
    let cls = 'rule-item';
    let fb = '';
    if (pick !== undefined) {
      done++;
      const isRight = (pick === 'keep') === r.shouldKeep;
      if (isRight) correct++;
      cls += isRight ? ' right' : ' wrong';
      if (!r.shouldKeep && isRight) cls += ' deleted';
      fb = (isRight ? '✅ 判断准确！' : '❌ 差点踩坑！') + r.reason;
    }
    return `
      <div class="${cls}">
        <div class="rule-top">
          <div class="rule-text">${r.id + 1}. ${r.text}</div>
          <div class="rule-actions">
            <button type="button" class="demo-btn safe sm" onclick="judgeRule(${r.id},'keep')">保留</button>
            <button type="button" class="demo-btn danger sm" onclick="judgeRule(${r.id},'drop')">删掉</button>
          </div>
        </div>
        <div class="rule-fb">${fb}</div>
      </div>
    `;
  }).join('');
  document.getElementById('auditProgress').textContent = '已判断：' + done + ' / ' + auditRules.length + ' 条';
  const scoreEl = document.getElementById('auditScore');
  if (done === auditRules.length) {
    scoreEl.textContent = '🎉 体检完成：判断正确 ' + correct + ' / 6 条 · 真正该留的只有 3 条硬红线！';
    scoreEl.style.color = '#15803d';
  } else if (done > 0) {
    scoreEl.textContent = '当前正确：' + correct + ' / ' + done + ' 条';
    scoreEl.style.color = '#b64b0a';
  } else {
    scoreEl.textContent = '点击每条右侧「保留」或「删掉」开始体检';
    scoreEl.style.color = '#b64b0a';
  }
}

function judgeRule(id, choice) {
  auditState[id] = choice;
  renderAudit();
}

function resetAudit() {
  auditState = {};
  renderAudit();
}

function switchTpl(key) {
  activeTpl = key;

  document.getElementById('tabWeb').classList.toggle('on', key === 'web');
  codeEl.textContent = templates[key].code;
}

function toggleCheck(btn) {
  btn.setAttribute('aria-pressed', btn.classList.toggle('checked'));
}

async function copyById(elId, btnId, defaultLabel) {
  const el = document.getElementById(elId);
  const btn = document.getElementById(btnId);
  if (!el || !btn) return;
  const text = el.textContent.trim();
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch {
    const field = document.createElement('textarea');
    field.value = text;
    field.className = 'copy-field';
    content.append(field);
    field.select();
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
  }
  btn.textContent = copied ? '已复制 ✓' : '请手动复制';
  btn.style.background = copied ? '#34c759' : '#ff8c00';
  setTimeout(() => {
    if (btn.isConnected) {
      btn.textContent = defaultLabel;
      btn.style.background = '';
    }
  }, 1800);
}

document.addEventListener('keydown', event => {
  if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[1-6]$/.test(event.key)) {
    openModal(keys[Number(event.key) - 1]);
  }
});
